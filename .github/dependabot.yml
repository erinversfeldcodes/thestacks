version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      elixir-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/vision
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vision-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      py-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/scraper
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      scraper-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/core/assets
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      assets-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /apps/vision
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy/searxng
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy/log-shipper
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
