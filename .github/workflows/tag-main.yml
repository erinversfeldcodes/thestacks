name: Tag main

# Reviewer P1 #5: every commit that lands on main gets a deterministic
# lightweight tag (`main-<short-sha>`) so deploy-production's record-prev-state
# step has a stable source of truth for the prev Modal commit. The old
# `deployed-modal~1` approach was brittle — a tag force-push races with a
# concurrent deploy and can either point at the wrong commit or vanish.
#
# A plain moving ref like `deployed-modal` that ANY workflow rewrites is
# inherently shifting; giving every main commit its own fixed tag removes the
# race entirely. `record-prev-state` just queries the two most-recent
# main-<sha> tags by committer date and uses the older one.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create lightweight tag for this main commit
        run: |
          short="$(git rev-parse --short=12 HEAD)"
          tag="main-${short}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — nothing to do."
              exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "Tagged ${GITHUB_SHA} as ${tag}"
