name: Reseed staging Neon branch

on:
  push:
    branches: [main]
    paths:
      - 'apps/core/priv/repo/seeds.exs'
      - 'apps/core/priv/repo/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reseed-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read .versions
        id: v
        run: |
          source .versions
          {
            echo "otp=${OTP_VERSION}"
            echo "elixir=${ELIXIR_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ steps.v.outputs.otp }}
          elixir-version: ${{ steps.v.outputs.elixir }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Resolve staging branch DATABASE_URL
        id: neon
        env:
          NEON_STAGING_PROJECT_ID: ${{ secrets.NEON_STAGING_PROJECT_ID }}
          NEON_STAGING_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          set -euo pipefail
          BRANCH_ID="$(curl -sfL \
            -H "Authorization: Bearer $NEON_STAGING_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_STAGING_PROJECT_ID/branches" \
            | python3 -c "
          import json, sys
          branches = json.load(sys.stdin).get('branches', [])
          match = [b['id'] for b in branches if b.get('name') == 'staging']
          print(match[0] if match else '')
          ")"
          if [[ -z "$BRANCH_ID" ]]; then
            echo "::error::staging branch not found in project $NEON_STAGING_PROJECT_ID"
            exit 1
          fi
          echo "branch-id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          URI="$(curl -sfL \
            -H "Authorization: Bearer $NEON_STAGING_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_STAGING_PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=neondb&role_name=neondb_owner&pooled=true" \
            | python3 -c "import json, sys; print(json.load(sys.stdin).get('uri', ''))")"
          if [[ -z "$URI" ]]; then
            echo "::error::could not resolve connection URI for staging branch"
            exit 1
          fi
          echo "::add-mask::$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Install Elixir deps
        working-directory: apps/core
        run: mix deps.get --only prod

      - name: Generate Ecto schemas from proto
        run: bash scripts/gen-ecto-proto.sh

      - name: Generate inter-service Elixir proto structs
        run: bash scripts/gen-elixir-proto.sh

      - name: Apply migrations to staging
        working-directory: apps/core
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
          CLOAK_KEY: ${{ secrets.CLOAK_KEY }}
          VISION_HMAC_SECRET: ${{ secrets.VISION_HMAC_SECRET }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VISION_SERVICE_URL: http://localhost:8000
        run: mix ecto.migrate

      - name: Run seeds against staging
        working-directory: apps/core
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
          CLOAK_KEY: ${{ secrets.CLOAK_KEY }}
          VISION_HMAC_SECRET: ${{ secrets.VISION_HMAC_SECRET }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VISION_SERVICE_URL: http://localhost:8000
          ALLOW_SEEDS: "true"
        run: mix run priv/repo/seeds.exs

      - name: Summary
        run: |
          echo "Staging branch ${{ steps.neon.outputs.branch-id }} reseeded."
          echo "Future preview/<pr> branches forked from this staging will"
          echo "inherit the latest fixtures via Neon copy-on-write."
