name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate-pre-push-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    permissions:
      pull-requests: read
    steps:
      - name: Check pre-push report on PR description
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"

          extract_block() {
              local start="$1" end="$2"
              awk -v s="$start" -v e="$end" '
                  $0 ~ s { f=1; next }
                  $0 ~ e { f=0 }
                  f
              ' <<< "$body"
          }

          block_is_green() {
              local label="$1" block="$2"
              if [[ -z "$block" ]]; then
                  echo "Gate: ${label} block missing or empty in PR description"
                  return 1
              fi
              if grep -q '❌' <<< "$block"; then
                  echo "Gate: ${label} block has at least one ❌"
                  return 1
              fi
              if ! grep -q '✅' <<< "$block"; then
                  echo "Gate: ${label} block has no ✅ rows (likely a 'skipped' sentinel)"
                  return 1
              fi
              return 0
          }

          ci_block="$(extract_block '<!-- ci-summary-start -->' '<!-- ci-summary-end -->')"

          proceed=true
          block_is_green "ci-summary" "$ci_block" || proceed=false

          if [[ "$proceed" == "true" ]]; then
              echo "Gate: pre-push report is fully green; CI will proceed."
          else
              echo "Gate: pre-push report not all green; CI will skip remaining jobs."
              echo "Push without skipping the local hook (don't pass --no-verify) and"
              echo "ensure ci-summary lands green to trigger a CI run."
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

  versions:
    needs: gate-pre-push-report
    if: |
      always() &&
      (needs.gate-pre-push-report.result == 'skipped' ||
       (needs.gate-pre-push-report.result == 'success' &&
        needs.gate-pre-push-report.outputs.proceed == 'true'))
    runs-on: ubuntu-latest
    outputs:
      otp: ${{ steps.v.outputs.otp }}
      elixir: ${{ steps.v.outputs.elixir }}
      node: ${{ steps.v.outputs.node }}
      python: ${{ steps.v.outputs.python }}
      postgres: ${{ steps.v.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read .versions
        id: v
        run: |
          source .versions
          {
            echo "otp=${OTP_VERSION}"
            echo "elixir=${ELIXIR_VERSION}"
            echo "node=${NODE_VERSION}"
            echo "python=${PYTHON_VERSION}"
            echo "postgres=${POSTGRES_VERSION}"
          } >> "$GITHUB_OUTPUT"

  changes:
    needs: gate-pre-push-report
    if: |
      always() &&
      (needs.gate-pre-push-report.result == 'skipped' ||
       (needs.gate-pre-push-report.result == 'success' &&
        needs.gate-pre-push-report.outputs.proceed == 'true'))
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.filter.outputs.elixir }}
      elm: ${{ steps.filter.outputs.elm }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      proto: ${{ steps.filter.outputs.proto }}
      dbt: ${{ steps.filter.outputs.dbt }}
      e2e: ${{ steps.filter.outputs.e2e }}
      migrations: ${{ steps.filter.outputs.migrations }}
      licenses: ${{ steps.filter.outputs.licenses }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
      iac: ${{ steps.filter.outputs.iac }}
      lockfiles: ${{ steps.filter.outputs.lockfiles }}
      source: ${{ steps.filter.outputs.source }}
      vision_deps: ${{ steps.filter.outputs.vision_deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            elixir:
              - 'apps/core/**'
              - 'mix.exs'
              - 'mix.lock'
            elm:
              - 'frontend/**'
            rust:
              - 'apps/scraper/**'
            python:
              - 'apps/vision/**'
            proto:
              - 'proto/**'
            dbt:
              - 'dbt/**'
            e2e:
              - 'frontend/**'
              - 'apps/core/**'
              - 'apps/vision/**'
              - 'e2e/**'
            migrations:
              - 'apps/core/priv/repo/migrations/**'
            licenses:
              - 'mix.lock'
              - 'frontend/package-lock.json'
              - 'e2e/package-lock.json'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            docker:
              - '**/Dockerfile*'
              - '.dockerignore'
            iac:
              - '**/Dockerfile*'
              - 'deploy/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
            lockfiles:
              - 'mix.lock'
              - 'frontend/package-lock.json'
              - 'e2e/package-lock.json'
              - 'apps/scraper/Cargo.lock'
              - 'apps/vision/requirements*.txt'
              - 'scripts/mcp/requirements.txt'
              - 'flake.lock'
            vision_deps:
              - 'apps/vision/requirements*.txt'
              - 'apps/vision/requirements*.lock'
              - 'requirements/**'
            source:
              - 'apps/**'
              - 'frontend/**'
              - 'scripts/**'
              - 'proto/**'
              - 'dbt/**'

  lint-elixir:
    needs: [changes, versions]
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: dialyzer-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-
      - run: mix deps.get
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate Elixir proto artifacts
        run: |
          scripts/gen-ecto-proto.sh
          python3 scripts/gen_python_proto.py --language elixir
      - run: scripts/lint-elixir.sh

  test-elixir:
    needs: [changes, versions]
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stacks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STACKS_APP_DB_PASSWORD: ci-stacks-app-password
      STACKS_DBT_DB_PASSWORD: ci-stacks-dbt-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-
      - run: mix deps.get
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate proto artifacts
        run: |
          scripts/gen-ecto-proto.sh
          python3 scripts/gen_python_proto.py --language elixir
          scripts/gen-elm-proto.sh
      - name: Build frontend into priv/static
        working-directory: apps/core/assets
        run: |
          npm ci
          npm run deploy
      - run: scripts/test-elixir.sh

  test-elm:
    needs: [changes, versions]
    if: needs.changes.outputs.elm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('frontend/elm.json') }}
          restore-keys: elm-${{ runner.os }}-
      - working-directory: frontend
        run: npm ci
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - run: scripts/lint-elm.sh
      - run: scripts/test-elm.sh

  test-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/scraper/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/scraper/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-llvm-cov --locked
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate Rust proto artifacts
        run: scripts/gen-rust-proto.sh
      - run: scripts/lint-rust.sh
      - run: scripts/test-rust.sh

  test-python:
    needs: [changes, versions]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - working-directory: apps/vision
        run: pip install --require-hashes -r requirements-dev.lock
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate Python proto artifacts
        run: python3 scripts/gen_python_proto.py --language python
      - run: scripts/lint-python.sh
      - run: scripts/test-python.sh

  lint-proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - run: scripts/lint-proto.sh

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/5db9d9cde2f3deb5035dea3e45f0a9fff2f29448/scripts/download-actionlint.bash) 1.7.4 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        # No-arg invocation auto-discovers .github/workflows/*.yml. Composite
        # actions under .github/actions/**/action.yml are validated via the
        # workflows that consume them (actionlint follows `uses:` references).
        # Any non-zero exit fails the job — the inline shellcheck warnings
        # we previously triaged are now fixed at source rather than
        # suppressed, so this command should produce no output.
        run: actionlint

  test-dbt:
    needs: [changes, versions]
    if: needs.changes.outputs.dbt == 'true' || needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stacks_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp${{ needs.versions.outputs.otp }}-elixir${{ needs.versions.outputs.elixir }}-
      - name: Install Elixir deps
        env:
          MIX_ENV: dev
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stacks_dev
        run: mix deps.get
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate proto artifacts
        run: |
          scripts/gen-ecto-proto.sh
          python3 scripts/gen_python_proto.py --language elixir
      - name: Install dbt-postgres, sqlfluff, and dbt-checkpoint
        run: pip install dbt-postgres==1.10.2 sqlfluff==4.2.2 sqlfluff-templater-dbt==4.2.2 'git+https://github.com/dbt-checkpoint/dbt-checkpoint.git@ff0bdf428ef49ed6ba70185bc797c76d4ad5b56b'
      - name: Seed and test dbt staging layer
        env:
          MIX_ENV: dev
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stacks_dev
          CLOAK_KEY: ${{ secrets.CLOAK_KEY }}
          VISION_HMAC_SECRET: ${{ secrets.VISION_HMAC_SECRET }}
          DBT_HOST: localhost
          DBT_PORT: "5432"
          DBT_USER: postgres
          DBT_PASSWORD: postgres
          DBT_DBNAME: stacks_dev
          SQLFLUFF_TEMPLATER: dbt
        run: |
          scripts/lint-sql.sh
          scripts/test-dbt.sh
          scripts/lint-dbt.sh

  gitleaks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: deploy/Dockerfile.core
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: deploy/Dockerfile.vision
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: deploy/Dockerfile.scraper

  semgrep:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload semgrep SARIF to code scanning
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error --sarif --output semgrep.sarif
      - name: Upload semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  vision-lock-drift:
    needs: changes
    if: ${{ needs.changes.outputs.vision_deps == 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.14-slim
    steps:
      - name: Install git (slim image lacks it)
        run: |
          apt-get update && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate vision locks and fail on drift
        run: |
          set -euo pipefail
          pip install --quiet --root-user-action=ignore pip-tools==7.5.3
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras \
            --output-file apps/vision/requirements.lock apps/vision/requirements.txt
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras \
            --output-file apps/vision/requirements-dev.lock \
            apps/vision/requirements.txt apps/vision/requirements-dev.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code apps/vision/requirements.lock apps/vision/requirements-dev.lock; then
            echo "::error::vision lockfiles are stale — run 'just lock-vision' and commit the result"
            exit 1
          fi

  checkov:
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: deploy/

  trivy:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.lockfiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  security-squawk:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install squawk
        run: npm install -g squawk-cli@2.47.0
      - name: Lint changed migrations
        run: |
          set +e
          scripts/security-squawk.sh origin/main
          rc=$?
          set -e
          if [[ "$rc" == "2" ]]; then
            echo "::warning title=squawk inspected 0 migrations::The migration-lint job ran because migrations changed, yet squawk found nothing to analyse. This is NOT a pass."
            exit 0
          fi
          exit "$rc"

  check-licenses:
    needs: [changes, versions]
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - name: Install Elixir deps
        run: mix deps.get
      - name: Check licences
        run: scripts/check-licenses.sh

  trufflehog:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: '.'
          base: main
          head: HEAD
          extra_args: '--only-verified'

  syft-grype:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.lockfiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install grype and scan
        run: |
          curl -sSfL -o /tmp/grype-install.sh \
            https://raw.githubusercontent.com/anchore/grype/v0.115.0/install.sh
          sh /tmp/grype-install.sh -b /usr/local/bin v0.115.0
          grype db update
          grype dir:. --fail-on high --only-fixed

  dockle:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Generate proto artifacts for Docker builds
        run: |
          python3 scripts/gen_python_proto.py --language rust
          python3 scripts/gen_python_proto.py --language python
      - name: Build images for CIS benchmark
        run: |
          docker build -q -t stacks-dockle-core    -f deploy/Dockerfile.core    .
          docker build -q -t stacks-dockle-vision  -f deploy/Dockerfile.vision  .
          docker build -q -t stacks-dockle-scraper -f deploy/Dockerfile.scraper .
      - name: Scan images with dockle
        env:
          DOCKLE_IGNORES: DKL-DI-0006,CIS-DI-0010,DKL-DI-0005
          DOCKLE_ACCEPT_KEYS: PHX_SERVER,ERL_INETRC,--chown,savedAptMark,GNUPGHOME,GPG_KEY
        run: |
          DOCKLE_VERSION=$(curl -s "https://api.github.com/repos/goodwithtech/dockle/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sL -o dockle.deb "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.deb"
          sudo dpkg -i dockle.deb && rm dockle.deb
          dockle --exit-code 1 --exit-level WARN stacks-dockle-core
          dockle --exit-code 1 --exit-level WARN stacks-dockle-vision
          dockle --exit-code 1 --exit-level WARN stacks-dockle-scraper

  migration-safety:
    needs: [changes, versions]
    if: needs.changes.outputs.migrations == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stacks_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: dev
      CLOAK_KEY: ${{ secrets.CLOAK_KEY }}
      VISION_HMAC_SECRET: ${{ secrets.VISION_HMAC_SECRET }}
      DB_BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'db-breaking') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Install squawk
        run: npm install -g squawk-cli@2.47.0

      - name: squawk — destructive migration rules
        run: |
          set +e
          scripts/security-squawk.sh origin/main
          rc=$?
          set -e
          if [[ "$rc" == "2" ]]; then
            echo "::warning title=squawk inspected 0 migrations::migration-safety ran because migrations changed, yet squawk found nothing to analyse. This is NOT a pass."
            exit 0
          fi
          exit "$rc"

      - name: lint-migrations — require @breaking_ok on destructive Ecto ops
        run: |
          changed="$(git diff --name-only --diff-filter=AM origin/main...HEAD \
              | grep '^apps/core/priv/repo/migrations/.*\.exs$' || true)"
          if [[ -z "${changed}" ]]; then
            echo "No migration files changed — skipping lint-migrations."
            exit 0
          fi
          echo "Linting:"
          # Intentionally unquoted so each path is its own argv entry. Both
          # `printf` and `lint-migrations.sh` rely on the shell expanding
          # ${changed} into multiple words.
          # shellcheck disable=SC2086
          printf '  %s\n' ${changed}
          # shellcheck disable=SC2086
          scripts/lint-migrations.sh ${changed}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}

      - name: Install mix deps (HEAD)
        run: mix deps.get
      - name: Generate proto artifacts (HEAD)
        run: |
          scripts/gen-ecto-proto.sh
          python3 scripts/gen_python_proto.py --language elixir

      - name: Dump BEFORE and AFTER structure
        run: |
          mkdir -p /tmp/schema
          MIG_DIR=apps/core/priv/repo/migrations

          rm -rf "${MIG_DIR}"
          git checkout origin/main -- "${MIG_DIR}"
          mix ecto.drop || true
          mix ecto.create
          mix ecto.migrate
          mix ecto.dump --dump-path /tmp/schema/before.sql

          rm -rf "${MIG_DIR}"
          git checkout HEAD -- "${MIG_DIR}"
          mix ecto.drop || true
          mix ecto.create
          mix ecto.migrate
          mix ecto.dump --dump-path /tmp/schema/after.sql

      - name: check-schema-diff — destructive changes require db-breaking label
        run: scripts/check-schema-diff.sh /tmp/schema/before.sql /tmp/schema/after.sql

  dashboard-render-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start VictoriaMetrics (local docker)
        run: docker compose -f infra/local-observability/docker-compose.yml up -d victoriametrics
      - name: Render gate — every panel renders non-empty
        run: bash scripts/dashboard-render-gate.sh

  deploy-preview:
    # TODO: restore full dependency list after deploy-preview is stable:
    # needs: [versions, test-elixir, test-elm, test-rust, test-python, lint-proto, test-dbt, check-licenses, gitleaks, hadolint, semgrep, checkov, trivy, trufflehog, syft-grype, dockle]
    needs: [versions, changes]
    if: |
      github.event_name == 'pull_request' && (
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.iac == 'true' ||
        needs.changes.outputs.lockfiles == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEON_STAGING_PROJECT_ID: ${{ secrets.NEON_STAGING_PROJECT_ID }}
      NEON_STAGING_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      VISION_TOGETHER_API_KEY: ${{ secrets.VISION_TOGETHER_API_KEY }}
      VISION_HMAC_SECRET: ${{ secrets.VISION_HMAC_SECRET }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      CLOAK_KEY: ${{ secrets.CLOAK_KEY }}
      SCRAPER_HMAC_SECRET: ${{ secrets.SCRAPER_HMAC_SECRET }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GUARDIAN_SECRET_KEY: ${{ secrets.GUARDIAN_SECRET_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SEARXNG_SECRET_KEY: ${{ secrets.SEARXNG_SECRET_KEY }}
      RESEND_API_KEY: ${{ contains(github.event.pull_request.labels.*.name, 'preview-real-email') && secrets.RESEND_API_KEY || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      STACKS_APP_DB_PASSWORD: ${{ secrets.STACKS_APP_DB_PASSWORD }}
      STACKS_DBT_DB_PASSWORD: ${{ secrets.STACKS_DBT_DB_PASSWORD }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Derive PREVIEW_SUFFIX (run-unique preview names, Issue #170 C)
        run: |
          echo "PREVIEW_SUFFIX=ci${GITHUB_RUN_ID: -6}" >> "$GITHUB_ENV"
          echo "PREVIEW_SUFFIX=ci${GITHUB_RUN_ID: -6}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.67
      - name: Alias fly -> flyctl
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v flyctl)" "$HOME/.local/bin/fly"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Install Elixir deps (for mix proto.sync inside deploy-stack.sh)
        run: mix deps.get
      - name: Install frontend deps (for node build.js inside deploy-stack.sh)
        working-directory: apps/core/assets
        run: npm ci
      - name: Install Modal (for vision deploy inside deploy-stack.sh)
        run: pip install modal==1.5.2
      - name: Generate proto artifacts for Docker builds
        run: |
          python3 scripts/gen_python_proto.py --language rust
          python3 scripts/gen_python_proto.py --language python
          scripts/gen-elm-proto.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install E2E deps and Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Deploy preview stack + warm vision pipeline
        run: scripts/deploy-preview.sh 2>&1 | tee /tmp/deploy-preview-output.txt; exit "${PIPESTATUS[0]}"
      - name: Pin Fly hostname to IPv4 in /etc/hosts
        run: |
          source scripts/lib/preview-names.sh
          derive_preview_names "${GITHUB_HEAD_REF:-preview}"
          CORE_URL="https://${PREVIEW_CORE_APP}.fly.dev"
          HOST="${PREVIEW_CORE_APP}.fly.dev"
          NEON_BRANCH="${PREVIEW_NEON_BRANCH}"
          {
            echo "CORE_URL=${CORE_URL}"
            echo "NEON_BRANCH=${NEON_BRANCH}"
            echo "GRAFANA_URL=https://${PREVIEW_GRAFANA_APP}.fly.dev"
          } >> "$GITHUB_ENV"
          IPV4="$(dig +short A "${HOST}" | grep -E '^[0-9.]+$' | head -1)"
          if [[ -z "${IPV4}" ]]; then
            echo "FAIL: no A record for ${HOST}"
            exit 1
          fi
          echo "${IPV4} ${HOST}" | sudo tee -a /etc/hosts
          echo "Pinned ${HOST} -> ${IPV4}"
          getent hosts "${HOST}"
      - name: Warm Fly machines and Neon database
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          for _ in {1..20}; do
            curl -sf --max-time 5 "${CORE_URL}/api/health" >/dev/null 2>&1 &
          done
          for _ in {1..10}; do
            curl -sf --max-time 10 "${CORE_URL}/login" >/dev/null 2>&1 &
          done
          for _ in {1..5}; do
            curl -sf --max-time 30 "${CORE_URL}/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"owner@thestacks.app","password":"dev-password-123"}' \
              >/dev/null 2>&1 &
          done
          for _ in {1..3}; do
            DB_TOKEN="$(curl -sf --max-time 30 "${CORE_URL}/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"owner@thestacks.app","password":"dev-password-123"}' \
              2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)"
            if [[ -n "${DB_TOKEN}" ]]; then
              curl -sf --max-time 30 "${CORE_URL}/api/catalogue?per_page=20" \
                -H "Authorization: Bearer ${DB_TOKEN}" >/dev/null 2>&1 || true
            fi
          done
          wait
          # Deterministic POST-path readiness (stability finding #2).
          # The parallel bursts above wake the machine, but a boundary cold-start
          # can still leave the first login POST 502ing while fly-proxy finishes
          # the wake — and auth.setup.ts's first action is a login POST. Poll
          # /api/auth/login until it returns a non-502 (200/401 both mean the app
          # served the request) so the setup project doesn't race the wake.
          login_warm=0
          for _ in {1..20}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -X POST "${CORE_URL}/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"warmup@thestacks.test","password":"warmup"}' 2>/dev/null || true)"
            if [[ -n "${code}" && "${code}" != "502" && "${code}" != "000" ]]; then
              echo "Login POST path warm (HTTP ${code})."
              login_warm=1
              break
            fi
            echo "Login POST not warm yet (HTTP ${code:-none}) — retrying in 3s..."
            sleep 3
          done
          if [[ "${login_warm}" != 1 ]]; then
            echo "::warning::login POST path never returned non-502 in warm-up — test-e2e.sh will re-warm and Playwright retries setup"
          fi
          sleep 2
      - name: Preflight — external resolver health
        run: bash scripts/preflight-resolver-health.sh
      - name: Wait for Grafana readiness (observability specs run in-suite)
        run: |
          ok=0
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null --max-time 10 "${GRAFANA_URL}/api/health"; then
              ok=1
              break
            fi
            echo "Grafana ${GRAFANA_URL} not ready yet — retrying in 5s..."
            sleep 5
          done
          if [[ "${ok}" != 1 ]]; then
            echo "::warning::preview Grafana ${GRAFANA_URL} not reachable after ~100s — dashboards.spec will surface it as a failure in-suite rather than skip"
          else
            echo "Grafana reachable at ${GRAFANA_URL}"
          fi
      - name: Run E2E against deployed stack
        run: |
          ( while true; do
              curl -sf --max-time 5 "${CORE_URL}/api/health" >/dev/null 2>&1 || true
              sleep 20
            done ) &
          KEEPALIVE_PID=$!
          trap 'kill "${KEEPALIVE_PID}" 2>/dev/null || true' EXIT
          CI=1 E2E_SERVICES=none E2E_EXPECT_LIVE_METRICS=1 E2E_EXPECT_FULL_SEEDS=1 \
            E2E_EXPECT_RATE_LIMITING=1 \
            GRAFANA_URL="${GRAFANA_URL}" BASE_URL="${CORE_URL}" scripts/test-e2e.sh
      - name: Dashboard emission gate (preview VictoriaMetrics)
        if: ${{ !cancelled() }}
        run: |
          source scripts/lib/preview-names.sh
          derive_preview_names "${GITHUB_HEAD_REF:-preview}"
          fly proxy 18428:8428 "${PREVIEW_VM_APP}.flycast" --app "${PREVIEW_VM_APP}" >/tmp/vmproxy.log 2>&1 &
          PROXY=$!
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:18428/health 2>/dev/null && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://localhost:18428/health 2>/dev/null; then
            echo "::warning::preview VM unreachable via fly proxy ($(tail -1 /tmp/vmproxy.log 2>/dev/null)) — skipping emission gate"
            kill "$PROXY" 2>/dev/null || true
            exit 0
          fi
          sleep 30   # cover push interval (15s) + VM flush (~10s) + latencyOffset for the last drive
          set +e
          EMISSION_GATE_VM=http://localhost:18428 \
          EMISSION_GATE_APP="${PREVIEW_CORE_APP}" \
            bash scripts/dashboard-emission-gate.sh
          rc=$?
          set -e
          kill "$PROXY" 2>/dev/null || true
          exit $rc
      - name: Smoke — circuit breakers
        if: always()
        run: |
          if [[ -n "${SCRAPER_HMAC_SECRET:-}" ]]; then
            bash scripts/smoke-circuit-breakers.sh "${CORE_URL}" || true
          else
            echo "SKIP: SCRAPER_HMAC_SECRET not set"
          fi
      - name: Security live — OWASP ZAP baseline
        if: always()
        run: |
          zap_out="$(docker run --rm \
            --mount type=tmpfs,destination=/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${CORE_URL}" 2>&1)" || true
          echo "${zap_out}"
          if echo "${zap_out}" | grep -q "FAIL-NEW: 0"; then
            echo "PASS: ZAP baseline"
          else
            echo "WARN: ZAP baseline found new failures (advisory)"
          fi
      - name: Security live — IDOR cross-user check
        if: always()
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          U1="$(curl -sf "${CORE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"owner@thestacks.app","password":"dev-password-123"}' 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)"
          U2="$(curl -sf "${CORE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"user@thestacks.app","password":"dev-password-456"}' 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)"
          if [[ -z "${U1}" ]] || [[ -z "${U2}" ]]; then
            echo "FAIL: IDOR — could not authenticate both seed users (auth seed broken or login regressed)"
            exit 1
          fi
          # Try each of the 5 named bookshelves until we find a placement.
          # Distribution of seeded placements across bookshelves isn't
          # contractual — only "owner has at least one placement" is — so
          # we don't hard-code which bookshelf to look in.
          PLACEMENT=""
          USED_BOOKSHELF=""
          for bookshelf in library antilibrary wishlist reading-pile looking-for-home; do
            candidate="$(curl -sf "${CORE_URL}/api/bookshelves/${bookshelf}" \
              -H "Authorization: Bearer ${U1}" 2>/dev/null \
              | python3 -c \
                "import json,sys; d=json.load(sys.stdin); s=d.get('shelves',[]); p=[pl for sh in s for pl in sh.get('placements',[])]; print(p[0]['id'] if p else '')" \
              2>/dev/null || true)"
            if [[ -n "${candidate}" ]]; then
              PLACEMENT="${candidate}"
              USED_BOOKSHELF="${bookshelf}"
              break
            fi
          done
          if [[ -z "${PLACEMENT}" ]]; then
            echo "FAIL: IDOR — owner has no placements across any of the 5 bookshelves; staging seed contract is to populate at least one"
            exit 1
          fi
          echo "Using placement ${PLACEMENT} from bookshelf '${USED_BOOKSHELF}'"
          IDOR_CODE="$(curl -o /dev/null -s -w "%{http_code}" \
            -X DELETE "${CORE_URL}/api/placements/${PLACEMENT}" \
            -H "Authorization: Bearer ${U2}")"
          if [[ "${IDOR_CODE}" == "200" ]]; then
            echo "FAIL: IDOR — user2 deleted user1's placement (HTTP 200)"
            exit 1
          else
            echo "PASS: IDOR cross-user DELETE blocked (HTTP ${IDOR_CODE})"
          fi
      - name: Cleanup preview stack
        if: always()
        run: |
          bash scripts/cleanup-preview.sh \
            --branch "${GITHUB_HEAD_REF:-preview}" \
            --neon-branch-name "${NEON_BRANCH:-}" || true
      - name: Post deployed E2E results to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/hooks/lib/post-deployed-e2e-to-pr.sh
