name: Dependabot lock auto-regen

on:
  pull_request:
    paths:
      - 'requirements/**'
      - 'apps/vision/requirements*.txt'

permissions:
  contents: read

jobs:
  regen:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the regenerated lockfiles to the PR branch
    container:
      image: python:3.14-slim
    steps:
      - name: Install git (slim image lacks it)
        run: |
          apt-get update && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Regenerate vision locks
        run: |
          set -euo pipefail
          pip install --quiet --root-user-action=ignore pip-tools==7.5.3
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras \
            --output-file apps/vision/requirements.lock apps/vision/requirements.txt
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras \
            --output-file apps/vision/requirements-dev.lock \
            apps/vision/requirements.txt apps/vision/requirements-dev.txt
      - name: Commit and push if the locks changed
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet apps/vision/requirements.lock apps/vision/requirements-dev.lock; then
            echo "Locks already in sync — nothing to push."
          else
            git add apps/vision/requirements.lock apps/vision/requirements-dev.lock
            git commit -m "chore(deps): regenerate hash-pinned vision locks [dependabot skip]"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
