
use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo
      - bing
      - open_library
      - google_books

server:
  secret_key: "__SEARXNG_SECRET_KEY__"  # checkov:skip=CKV_SECRET_6: deploy-time template placeholder, replaced by deploy-stack.sh
  bind_address: "0.0.0.0"
  port: 8080
  public_instance: false

search:
  formats:
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "en"

ui:
  infinite_scroll: false
  default_theme: simple
  static_use_hash: true

outgoing:
  pool_connections: 10
  pool_maxsize: 10
  request_timeout: 8.0
  max_request_timeout: 15.0

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
    categories:
      - general
      - books

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    categories:
      - general

  - name: bing
    engine: bing
    shortcut: b
    disabled: false
    categories:
      - general

  - name: open_library
    engine: open_library
    shortcut: ol
    disabled: false
    categories:
      - books

  - name: google_books
    engine: google_books
    shortcut: gb
    disabled: false
    categories:
      - books
