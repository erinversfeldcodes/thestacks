app = "thestacks-core"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.core"

[deploy]
  release_command = "/app/bin/core eval 'Stacks.Release.migrate()'"

[env]
  # The production domain (certs linked to this app). Phoenix builds absolute
  # URLs from this — confirmation and password-reset links above all.
  # NOTE: scripts/deploy-stack.sh sets PHX_HOST as a Fly *secret*, which
  # overrides this [env] value. Both are kept correct so a bare `fly deploy`
  # and a scripted deploy agree; previews get "${CORE_APP}.fly.dev" instead.
  PHX_HOST = "readinginthestacks.com"
  PORT = "4000"
  ECTO_IPV6 = "true"
  SEARXNG_URL = "http://thestacks-searxng.internal:8080"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Scale to zero when idle. `0` is CORRECT, not merely tolerated: Oban's Cron
  # plugin fires only while a node is up and does not backfill, which used to
  # make this look like a correctness risk — but every non-staleness case (price
  # refresh, scraper index build, listing expiry, source discovery) was made
  # event-driven during the 2026-07-27 campaign, and ImageRetentionJob is a
  # safety net rather than a guarantee. Nothing breaks by scaling to zero.
  #
  # The remaining cost is purely LATENCY: a cold hit 502s while the machine
  # boots, which reads as a broken site and is also the `auth.setup` E2E flake
  # (#171/#177). Raising this to 1 is the fix and is deferred by decision
  # (owner, 2026-07-28) — to be addressed with latency work, not correctness.
  #
  # ⚠️ Do not reason backwards from this line to "the crons are reliable".
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

# NOTE(#323): the `[metrics]` block (Fly managed-Prometheus scrape of
# /internal/metrics, Issue #232) was REMOVED. It triggered Fly's platform
# scraper every 15s, but the scrape never ingested a single stacks_* series
# (#248) and 401'd continuously against StacksWeb.Plugs.MetricsAuth — the
# platform scraper cannot send the METRICS_SCRAPE_TOKEN bearer and its
# requests do not satisfy the 6PN bypass. ADR-021 replaced scraping with an
# in-BEAM PUSH (Core.PromEx.MetricsPusher → VictoriaMetrics via
# STACKS_METRICS_PUSH_URL), so nothing consumes the Fly scrape. Do not
# re-add a `[metrics]` block without also solving its auth.
# See docs/runbooks/metrics-stack.md.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 2
