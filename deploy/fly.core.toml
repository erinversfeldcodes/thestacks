app = "thestacks-core"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.core"

[deploy]
  release_command = "/app/bin/core eval 'Stacks.Release.migrate()'"

[env]
  PHX_HOST = "thestacks.fly.dev"
  PORT = "4000"
  ECTO_IPV6 = "true"
  SEARXNG_URL = "http://thestacks-searxng.internal:8080"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

# Fly's managed Prometheus scrapes this endpoint directly over the private
# 6PN network (never via fly-proxy), storing the series independently of the
# app machines so they survive redeploys (Issue #232). Because the scrape
# arrives over 6PN with no fly-proxy `fly-client-ip` header,
# StacksWeb.Plugs.MetricsAuth allows it WITHOUT the METRICS_SCRAPE_TOKEN
# bearer — while the same path over the public edge still requires the token.
# Deploy-time scrape/render smoke check: docs/runbooks/metrics-stack.md.
[metrics]
  port = 4000
  path = "/internal/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 2
