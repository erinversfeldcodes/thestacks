app = "thestacks-searxng"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "searxng/Dockerfile"

[env]
  SEARXNG_SETTINGS_PATH = "/etc/searxng/settings.yml"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[checks]]
  name = "alive"
  type = "http"
  port = 8080
  path = "/"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
