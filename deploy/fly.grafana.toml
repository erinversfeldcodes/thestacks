app = "thestacks-grafana"
primary_region = "iad"

[build]
  dockerfile = "grafana/Dockerfile"

[env]
  STACKS_VM_URL = "http://thestacks-victoriametrics.internal:8428"
  GF_AUTH_ANONYMOUS_ENABLED = "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE = "Viewer"
  GF_AUTH_DISABLE_LOGIN_FORM = "true"
  GF_AUTH_BASIC_ENABLED = "false"
  GF_USERS_ALLOW_SIGN_UP = "false"
  GF_USERS_DEFAULT_THEME = "dark"
  GF_SERVER_ROOT_URL = "https://thestacks-grafana.fly.dev"
  GF_ANALYTICS_REPORTING_ENABLED = "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES = "false"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale-to-zero: a dashboard visit wakes it via the proxy (few seconds
  # cold start); it only needs to be up while someone is actually looking.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
