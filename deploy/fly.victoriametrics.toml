app = "thestacks-victoriametrics"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"                 # allow VM to flush its in-memory buffer on exit

[build]
  image = "victoriametrics/victoria-metrics:v1.103.0"

[processes]
  vm = "--storageDataPath=/victoria-metrics-data --retentionPeriod=3 --httpListenAddr=:8428 --search.latencyOffset=15s"

[[services]]
  internal_port = 8428
  protocol = "tcp"
  processes = ["vm"]
  auto_stop_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 8428

[[mounts]]
  source = "vm_data"
  destination = "/victoria-metrics-data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                   # 256mb crash-loops on data-store reopen; 512 is safe
  cpus = 1
