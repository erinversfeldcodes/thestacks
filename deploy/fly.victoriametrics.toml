# VictoriaMetrics — self-hosted metrics store (ADR-021 / Epic #249 #252).
#
# Two lifecycles, one config:
#   • PREVIEW  — ephemeral app `stacks-vm-pr-<component>`, created by
#     deploy-stack.sh and DESTROYED on teardown (cleanup-preview.sh). No standing
#     cost. Validated by dashboard-smoke (real preview emission renders).
#   • PROD     — `thestacks-victoriametrics`, ALWAYS-ON (min_machines_running = 1).
#     The single standing cost. The core app stays scale-to-zero and PUSHES here
#     (Core.PromEx.MetricsPusher → /api/v1/import/prometheus over 6PN) — VM never
#     scrapes a sleeping app (the #248 failure mode), and prod Grafana (same 6PN)
#     reads it. Public sees Grafana, never VM.
#
# 6PN-ONLY: no [http_service] and no allocated public IP, so the write/query API is
# never internet-exposed. Reachable at `<app>.internal:8428` inside the org 6PN.
# Preview dashboard-smoke (runs in CI, outside 6PN) reaches it via `fly proxy`.
app = "thestacks-victoriametrics"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"                 # allow VM to flush its in-memory buffer on exit

[build]
  image = "victoriametrics/victoria-metrics:v1.103.0"

# Single VM process. `-search.latencyOffset=15s` (default 30s) so freshly pushed
# samples become queryable sooner — matters for the post-E2E preview smoke.
# 3-month retention; data on the mounted volume so it survives redeploys (#232).
[processes]
  # FLAGS ONLY — the image ENTRYPOINT is already `/victoria-metrics-prod`, and Fly
  # appends this cmd to it. Repeating the binary here ran `/victoria-metrics-prod
  # /victoria-metrics-prod --flags`, so VM's own path became the first positional
  # arg, Go's flag.Parse stopped there, every flag was ignored, and VM exited on
  # the unexpected argument → crash-loop → machine stopped. (Root cause of the
  # "VM won't stay up" saga.)
  vm = "--storageDataPath=/victoria-metrics-data --retentionPeriod=3 --httpListenAddr=:8428 --search.latencyOffset=15s"

# TCP service on 6PN only (no `handlers`/public IP → private). Gives `fly deploy`
# proper start-tracking + `min_machines_running`. NO health check: on a 6PN-only
# app Fly's checker can't reach the port, so a check sits perpetually "warning"
# and makes `fly deploy` hang. Liveness is proven by the CI emission smoke (real
# data lands). The VM stays up now that the `[processes]` cmd is flags-only (it
# was crash-looping on the double-binary before).
[[services]]
  internal_port = 8428
  protocol = "tcp"
  processes = ["vm"]
  auto_stop_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 8428

[[mounts]]
  source = "vm_data"
  destination = "/victoria-metrics-data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                   # 256mb crash-loops on data-store reopen; 512 is safe
  cpus = 1
