app = "thestacks-victoriametrics"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"                 # allow VM to flush its in-memory buffer on exit

[build]
  image = "victoriametrics/victoria-metrics:v1.103.0"

[processes]
  vm = "--storageDataPath=/victoria-metrics-data --retentionPeriod=3 --httpListenAddr=:8428 --search.latencyOffset=15s"

[[services]]
  internal_port = 8428
  protocol = "tcp"
  processes = ["vm"]
  # Scale-to-zero: awake exactly when something pushes or reads — core's
  # 15s metrics pushes hold it up while core is up, Grafana/billing queries
  # wake it on demand, and it sleeps ~5min after core does. The first push
  # after a wake may drop a sample or two during cold start; the 2h
  # last_over_time lookbacks tolerate that.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8428

[[mounts]]
  source = "vm_data"
  destination = "/victoria-metrics-data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                   # 256mb crash-loops on data-store reopen; 512 is safe
  cpus = 1
