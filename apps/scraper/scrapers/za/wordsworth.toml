[source]
name = "Wordsworth Books"
type = "bookshop"
country = "ZA"
# Shopify. Measured 2026-07-28: sku carries the ISBN on 46/50 sampled products but
# the handle does not, so products cannot be addressed by ISBN directly — the engine
# builds an ISBN→path index instead. robots.txt restricts nothing here.
url = "https://www.wordsworth.co.za"
has_physical_location = true
currency = "ZAR"

# ⚠️ DEAD for this store: it is Shopify, so lookups go through the product API.
# [selectors].price is still a required field for stores that have no product API.
[search]
method = "GET"
path = "/search"
query_param = "q"
query_template = "{isbn}"

[selectors]
price = ".product-price, .price"
title = ".product-name, .product-title"
currency = "ZAR"

[rate_limit]
requests_per_minute = 10
retry_after_seconds = 60
