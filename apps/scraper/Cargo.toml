[package]
name = "stacks-scraper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # edition 2024 requires 1.85; Option::is_none_or stabilised in 1.82

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
scraper = "0.26"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
