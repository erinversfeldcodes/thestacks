[package]
name = "stacks-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
scraper = "0.21"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
