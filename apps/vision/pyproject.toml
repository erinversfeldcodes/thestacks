[project]
name = "stacks-vision"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pyzbar.*"
ignore_missing_imports = true

# pytesseract ships no stubs. Declared per-module beside pyzbar, for the same
# reason: both are thin CPU wrappers around an apt-installed binary, and
# neither is worth a stub package — but a NEW untyped dependency must still
# fail the gate rather than be waved through by a blanket flag.
[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

# ⚖️ The GPU libraries exist only inside the Modal image, never in this venv or
# in CI, so there is nothing to stub against locally. Declared per-module
# rather than passing --ignore-missing-imports for the whole gate: everything
# else in apps/vision keeps strict import checking, and a NEW untyped
# dependency still fails instead of being waved through.
#
# ⛔ These three are what kept `modal_app.py` out of the gate entirely, which
# is how two unused-ignore errors and an untested cold-start reading sat in the
# file that holds the money measurement.
[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "qwen_vl_utils.*", "peft.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
