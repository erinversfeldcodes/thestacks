# .gitleaks.toml — gitleaks configuration for The Stacks
# All findings below are false positives in vendored/generated code.

[extend]
useDefault = true

[[allowlists]]
description = "Ignore vendored deps and compiled build artefacts"
paths = [
    '''deps/''',
    '''_build/''',
]

[[allowlists]]
description = "Ignore local dev env files (gitignored, never committed)"
paths = [
    '''^\.env$''',
    '''^\.env\.local$''',
    '''^\.env\..+\.local$''',
]
