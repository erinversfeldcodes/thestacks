<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Library Bookshelf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --font-heading: 'Cormorant Garamond', Georgia, serif;
    --text: #e8dcc8;
    --gold: #c8a050;
    --book-max-h: 290px;
    --book-depth: 160px;
    --plank-h: 18px;
    --plank-lip: 10px;
    --side-w: 24px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: #0e0a06;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === WALLPAPER === */
  .wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background: url('wallpaper-damask-green.png') repeat;
    background-size: 300px;
    filter: brightness(0.35) saturate(0.8);
  }
  .lighting {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at 15% 10%, rgba(255,200,120,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* === NAV === */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(14,10,6,0.95);
    border-bottom: 1px solid rgba(200,160,80,0.12);
    display: flex; justify-content: center; gap: 1.5rem;
    padding: 0.6rem 1rem; backdrop-filter: blur(8px);
  }
  .nav a {
    font-family: var(--font-heading); font-size: 0.95rem;
    color: var(--text); text-decoration: none;
    letter-spacing: 0.05em; opacity: 0.5; transition: opacity 0.3s;
    border-bottom: 2px solid transparent; padding: 0.3rem 0;
  }
  .nav a:hover { opacity: 0.85; }
  .nav a.active { opacity: 1; border-bottom-color: var(--gold); color: var(--gold); }

  /* === LABEL === */
  .shelf-label {
    text-align: center; padding: 1.5rem 0 0.6rem; position: relative; z-index: 10;
  }
  .shelf-label span {
    display: inline-block; padding: 0.3rem 2rem;
    background: linear-gradient(160deg, #d4b060, #a07830, #c8a050);
    border-radius: 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    font-family: var(--font-heading); font-size: 0.85rem;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: #1a0e06; text-shadow: 0 1px 0 rgba(255,255,255,0.12);
  }

  /* =============================================
     BOOKCASE
     One continuous piece of furniture.
     Side panels run full height as a single element.
     Shelves (planks + books) sit inside.
     ============================================= */
  .bookcase {
    position: relative; z-index: 5;
    max-width: 1060px;
    margin: 0 auto;
  }

  /* Continuous side panels */
  .bookcase__side {
    position: absolute;
    top: 0; bottom: 0;
    width: var(--side-w);
    background: url('shelf-walnut-plank.png') repeat;
    background-size: 160px 160px;
    filter: brightness(0.38) saturate(0.45);
    z-index: 20;
  }
  .bookcase__side--left { left: 0; }
  .bookcase__side--right { right: 0; }
  /* Inner edge shadow */
  .bookcase__side--left::after,
  .bookcase__side--right::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 6px;
  }
  .bookcase__side--left::after {
    right: 0;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.3));
  }
  .bookcase__side--right::after {
    left: 0;
    background: linear-gradient(270deg, transparent, rgba(0,0,0,0.3));
  }

  /* Inner content area between sides */
  .bookcase__inner {
    margin: 0 var(--side-w);
  }

  /* === SHELF ROW === */
  .shelf-row {
    position: relative;
    padding-bottom: calc(var(--plank-h) + var(--plank-lip));
  }

  /* Dark recessed back */
  .shelf-row__back {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: calc(var(--plank-h) + var(--plank-lip));
    background: #060402;
    box-shadow: inset 0 4px 20px rgba(0,0,0,0.7);
  }

  /* Plank */
  .shelf-row__plank {
    position: absolute;
    bottom: var(--plank-lip);
    /* Extend under the side panels */
    left: calc(-1 * var(--side-w));
    right: calc(-1 * var(--side-w));
    height: var(--plank-h);
    background: url('shelf-walnut-plank.png') repeat-x;
    background-size: auto 100%;
    filter: brightness(0.38) saturate(0.45);
    z-index: 15;
  }
  .shelf-row__plank::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: rgba(255,255,255,0.04);
  }

  /* Plank lip / front edge */
  .shelf-row__lip {
    position: absolute;
    bottom: 0;
    left: calc(-1 * var(--side-w));
    right: calc(-1 * var(--side-w));
    height: var(--plank-lip);
    background: url('shelf-walnut-plank.png') repeat-x;
    background-size: auto 100%;
    filter: brightness(0.25) saturate(0.4);
    z-index: 15;
  }

  /* Book row */
  .shelf-row__books {
    position: relative;
    min-height: var(--book-max-h);
    display: flex;
    align-items: flex-end;
    padding: 0 8px;
    z-index: 10;
  }

  /* =============================================
     BOOK — true 3D, petargyurov-style
     Three faces: spine, top, cover
     All always in DOM. Perspective shows spine
     by default. Hover rotates to reveal all three.
     ============================================= */
  .book {
    position: relative;
    flex-shrink: 0;
    margin-left: 1px;
    transform-style: preserve-3d;
    transform: translateZ(0) rotateY(0);
    transition: transform 0.8s ease;
    cursor: pointer;
  }

  .book:hover {
    z-index: 50;
    transform:
      translateZ(200px)
      rotateX(-25deg)
      rotateY(-40deg)
      rotateZ(-15deg);
  }

  /* All three faces share this */
  .book__face {
    position: absolute;
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 2px;
  }

  /* --- SPINE --- */
  .book__spine {
    width: 100%;
    height: 100%;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    transform: rotateY(0deg) translateZ(0px);
  }

  /* Spine curvature */
  .book__spine::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.06) 0%, transparent 15%,
      transparent 65%, rgba(0,0,0,0.12) 88%, rgba(0,0,0,0.2) 100%
    );
    pointer-events: none; z-index: 2;
  }

  .book__band {
    position: absolute; left: 3px; right: 3px; height: 1.5px;
    background: linear-gradient(90deg,
      transparent 5%, rgba(255,255,255,0.1) 30%,
      rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.1) 70%, transparent 95%
    );
    box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    z-index: 1;
  }

  .book__title {
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family: var(--font-heading); font-size: 11px; font-weight: 600;
    letter-spacing: 0.03em; line-height: 1.15;
    overflow: hidden; flex: 1;
    padding: 12px 3px 6px; z-index: 3;
  }

  .book__author {
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family: var(--font-heading); font-size: 8px;
    letter-spacing: 0.06em;
    padding: 4px 3px 8px; z-index: 3; opacity: 0.6;
  }

  /* --- TOP (page edges) --- */
  .book__top {
    width: 100%;
    height: var(--book-depth);
    background:
      repeating-linear-gradient(90deg,
        #ede3cc 0px, #ede3cc 1px,
        #e5d9c0 1px, #e5d9c0 2px
      );
    transform: rotateX(90deg) translateZ(calc(var(--book-depth) / 2)) translateY(calc(var(--book-depth) / -2));
    top: 0;
    left: 0;
  }

  /* --- COVER --- */
  .book__cover {
    height: 100%;
    background-size: cover;
    transform: rotateY(90deg) translateZ(0);
    top: 0;
    left: 100%;
    transform-origin: left center;
  }

  /* Cover inner shadow (hinge) */
  .book__cover::after {
    content: ''; position: absolute;
    top: 0; left: 0; width: 15px; height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.3), transparent);
  }

  /* =============================================
     EMPTY SHELF
     ============================================= */
  .shelf-row--empty .shelf-row__books {
    justify-content: center; align-items: center;
  }
  .empty-msg {
    font-family: var(--font-heading); font-style: italic;
    font-size: 1.05rem; color: rgba(200,180,140,0.2);
  }

  /* =============================================
     BOOK DETAIL OVERLAY
     ============================================= */
  .book-detail {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10, 8, 6, 0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .book-detail.visible {
    opacity: 1; pointer-events: auto;
  }

  .book-detail__card {
    background: linear-gradient(145deg, #f5eed6, #e8dcc0);
    color: #2c1f0e;
    border-radius: 6px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.6);
    max-width: 600px; width: 92%;
    display: flex; gap: 1.5rem;
    padding: 2rem;
    position: relative;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.3s;
  }
  .book-detail.visible .book-detail__card {
    transform: translateY(0) scale(1);
  }
  .book-detail__card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #8b4513, #a0522d, #8b4513);
    border-radius: 6px 6px 0 0;
  }

  .book-detail__close {
    position: absolute; top: 0.75rem; right: 1rem;
    background: none; border: none;
    font-size: 1.5rem; color: #8b7a65; cursor: pointer;
    transition: color 0.2s;
  }
  .book-detail__close:hover { color: #2c1f0e; }

  .book-detail__cover {
    width: 140px; min-height: 200px; flex-shrink: 0;
    background-size: cover;
    border-radius: 3px;
    box-shadow: 4px 4px 16px rgba(0,0,0,0.3);
  }

  .book-detail__info { flex: 1; }

  .book-detail__title {
    font-family: var(--font-heading);
    font-size: 1.5rem; font-weight: 600;
    margin-bottom: 0.2rem;
  }
  .book-detail__author {
    font-family: var(--font-heading);
    font-size: 1rem; font-style: italic;
    color: #6b5a45; margin-bottom: 1.2rem;
  }

  .book-detail__section {
    margin-bottom: 1rem;
  }
  .book-detail__section h3 {
    font-family: var(--font-heading);
    font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: #8b7a65;
    margin-bottom: 0.4rem;
  }
  .book-detail__section p {
    font-size: 0.95rem; line-height: 1.5; color: #3d2b1f;
  }

  .book-detail__select {
    width: 100%; padding: 0.5rem 0.75rem;
    background: rgba(255,255,255,0.5);
    border: 1px solid #c8b89a; border-radius: 3px;
    font-family: var(--font-heading); font-size: 0.95rem;
    color: #2c1f0e;
  }

  .book-detail__formats {
    display: flex; gap: 1rem; flex-wrap: wrap;
  }
  .book-detail__formats label {
    font-family: var(--font-heading); font-size: 0.9rem;
    color: #3d2b1f; display: flex; align-items: center; gap: 0.3rem;
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="active">Library</a>
  <a href="#">AntiLibrary</a>
  <a href="#">WishList</a>
  <a href="#">Reading Pile</a>
  <a href="#">Catalogue</a>
</nav>

<!-- Book detail overlay -->
<div class="book-detail" id="bookDetail">
  <div class="book-detail__card">
    <button class="book-detail__close" onclick="document.getElementById('bookDetail').classList.remove('visible')">&times;</button>
    <div class="book-detail__cover" id="bd-cover"></div>
    <div class="book-detail__info">
      <h2 class="book-detail__title" id="bd-title"></h2>
      <p class="book-detail__author" id="bd-author"></p>
      <div class="book-detail__section">
        <h3>About</h3>
        <p>A captivating novel that explores the boundaries between obsession and devotion, set against the backdrop of a world both familiar and strange.</p>
      </div>
      <div class="book-detail__section">
        <h3>Shelf</h3>
        <select class="book-detail__select">
          <option>Library</option>
          <option>AntiLibrary</option>
          <option>WishList</option>
          <option>Reading Pile</option>
        </select>
      </div>
      <div class="book-detail__section">
        <h3>Formats</h3>
        <div class="book-detail__formats">
          <label><input type="checkbox" checked> Hardcover</label>
          <label><input type="checkbox"> Softcover</label>
          <label><input type="checkbox"> Kindle</label>
          <label><input type="checkbox"> Audiobook</label>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="wallpaper"></div>
<div class="lighting"></div>

<div style="padding-top: 3.5rem; position: relative; z-index: 5;">
  <div class="shelf-label"><span>Library</span></div>

  <div class="bookcase" id="bookcase">
    <div class="bookcase__side bookcase__side--left"></div>
    <div class="bookcase__side bookcase__side--right"></div>
    <div class="bookcase__inner" id="shelves"></div>
  </div>
</div>

<script>
const books = [
  { title: "The Secret History", author: "Donna Tartt", pages: 559 },
  { title: "Piranesi", author: "Susanna Clarke", pages: 272 },
  { title: "The Name of the Rose", author: "Umberto Eco", pages: 536 },
  { title: "If on a Winter's Night a Traveller", author: "Italo Calvino", pages: 260 },
  { title: "The Shadow of the Wind", author: "Carlos Ruiz Zafón", pages: 487 },
  { title: "Stoner", author: "John Williams", pages: 278 },
  { title: "The Goldfinch", author: "Donna Tartt", pages: 771 },
  { title: "Possession", author: "A.S. Byatt", pages: 555 },
  { title: "The Master and Margarita", author: "Mikhail Bulgakov", pages: 412 },
  { title: "Rebecca", author: "Daphne du Maurier", pages: 380 },
  { title: "Beloved", author: "Toni Morrison", pages: 324 },
  { title: "Middlemarch", author: "George Eliot", pages: 880 },
  { title: "Anna Karenina", author: "Leo Tolstoy", pages: 864 },
  { title: "One Hundred Years of Solitude", author: "García Márquez", pages: 417 },
  { title: "Atonement", author: "Ian McEwan", pages: 351 },
  { title: "The Bell Jar", author: "Sylvia Plath", pages: 244 },
  { title: "Wide Sargasso Sea", author: "Jean Rhys", pages: 171 },
  { title: "Giovanni's Room", author: "James Baldwin", pages: 169 },
  { title: "Circe", author: "Madeline Miller", pages: 393 },
  { title: "The Remains of the Day", author: "Kazuo Ishiguro", pages: 245 },
  { title: "A Gentleman in Moscow", author: "Amor Towles", pages: 462 },
  { title: "Hamnet", author: "Maggie O'Farrell", pages: 372 },
  { title: "Klara and the Sun", author: "Kazuo Ishiguro", pages: 303 },
  { title: "Shuggie Bain", author: "Douglas Stuart", pages: 430 },
  { title: "The Luminaries", author: "Eleanor Catton", pages: 832 },
  { title: "Wolf Hall", author: "Hilary Mantel", pages: 604 },
  { title: "Normal People", author: "Sally Rooney", pages: 266 },
  { title: "The Vanishing Half", author: "Brit Bennett", pages: 343 },
  { title: "Pachinko", author: "Min Jin Lee", pages: 490 },
  { title: "The Overstory", author: "Richard Powers", pages: 502 },
  { title: "Educated", author: "Tara Westover", pages: 334 },
  { title: "The Dutch House", author: "Ann Patchett", pages: 337 },
  { title: "Transcendent Kingdom", author: "Yaa Gyasi", pages: 264 },
  { title: "Such a Fun Age", author: "Kiley Reid", pages: 310 },
];

const textures = [
  { file: 'textures/spine-leather-burgundy.png', text: '#d4c4a0', gold: 0.6, leather: true },
  { file: 'textures/spine-leather-green.png',    text: '#d4c4a0', gold: 0.5, leather: true },
  { file: 'textures/spine-leather-navy.png',     text: '#c8b890', gold: 0.7, leather: true },
  { file: 'textures/spine-cloth-brown.png',      text: '#f0e6d4', gold: 0.15, leather: false },
  { file: 'textures/spine-cloth-red.png',        text: '#f0e4d0', gold: 0.25, leather: false },
  { file: 'textures/spine-cloth-olive.png',      text: '#e8dcc8', gold: 0.15, leather: false },
];

function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// Spine width: 35–55px (wider for legibility)
function sw(pages) { return Math.max(35, Math.min(55, Math.round(pages / 10))); }

// Spine height: 230–290px
function sh(pages) { return Math.round(230 + Math.min(pages / 700, 1) * 60 + (hash(String(pages)) % 8)); }

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function build() {
  const shelves = document.getElementById('shelves');
  const maxW = 1000;
  let row = [], rw = 0;

  books.forEach(b => {
    const w = sw(b.pages);
    if (rw + w > maxW && row.length) {
      addShelf(shelves, row);
      row = []; rw = 0;
    }
    row.push(b);
    rw += w + 1;
  });
  if (row.length) addShelf(shelves, row);
  addEmptyShelf(shelves);
}

function addShelf(container, booksOnShelf) {
  const row = el('div', 'shelf-row');
  row.appendChild(el('div', 'shelf-row__back'));

  const booksEl = el('div', 'shelf-row__books');

  booksOnShelf.forEach(book => {
    const w = sw(book.pages);
    const h = sh(book.pages);
    const tex = textures[hash(book.title) % textures.length];
    const useGold = (hash(book.title + 'g') % 100) / 100 < tex.gold;
    const depth = 160; // book depth in px

    const bk = el('div', 'book');
    bk.style.width = w + 'px';
    bk.style.height = h + 'px';

    // --- SPINE ---
    const spine = el('div', 'book__face book__spine');
    spine.style.backgroundImage = `url('${tex.file}')`;

    if (tex.leather) {
      const b1 = el('div', 'book__band'); b1.style.top = '16%';
      const b2 = el('div', 'book__band'); b2.style.bottom = '16%';
      spine.appendChild(b1);
      spine.appendChild(b2);
    }

    const title = el('span', 'book__title');
    title.textContent = book.title;
    title.style.color = useGold ? '#d4af37' : tex.text;
    title.style.textShadow = useGold
      ? '0 0 3px rgba(212,175,55,0.25), 0 1px 2px rgba(0,0,0,0.6)'
      : '0 1px 2px rgba(0,0,0,0.6)';

    const author = el('span', 'book__author');
    author.textContent = book.author;
    author.style.color = useGold ? 'rgba(212,175,55,0.5)' : tex.text;

    spine.appendChild(title);
    spine.appendChild(author);
    bk.appendChild(spine);

    // --- TOP (page edges) ---
    const top = el('div', 'book__face book__top');
    top.style.width = w + 'px';
    top.style.height = depth + 'px';
    // Position: rotated 90deg on X axis, sitting on top of the spine
    top.style.transform = `rotateX(90deg) translateZ(${depth / 2}px) translateY(-${depth / 2}px)`;
    top.style.top = '0';
    top.style.left = '0';
    bk.appendChild(top);

    // --- COVER ---
    const cover = el('div', 'book__face book__cover');
    cover.style.width = depth + 'px';
    cover.style.height = h + 'px';
    cover.style.backgroundImage = `url('${tex.file}')`;
    // Position: rotated 90deg on Y, hinged at left edge of cover = right edge of spine
    cover.style.transform = `rotateY(90deg)`;
    cover.style.transformOrigin = 'left center';
    cover.style.top = '0';
    cover.style.left = w + 'px';
    bk.appendChild(cover);

    booksEl.appendChild(bk);
  });

  row.appendChild(booksEl);
  row.appendChild(el('div', 'shelf-row__plank'));
  row.appendChild(el('div', 'shelf-row__lip'));
  container.appendChild(row);
}

function addEmptyShelf(container) {
  const row = el('div', 'shelf-row shelf-row--empty');
  row.appendChild(el('div', 'shelf-row__back'));
  const booksEl = el('div', 'shelf-row__books');
  const msg = el('div', 'empty-msg');
  msg.textContent = 'Room for more stories…';
  booksEl.appendChild(msg);
  row.appendChild(booksEl);
  row.appendChild(el('div', 'shelf-row__plank'));
  row.appendChild(el('div', 'shelf-row__lip'));
  container.appendChild(row);
}

build();

// Click — open book detail view
document.addEventListener('click', (e) => {
  const book = e.target.closest('.book');
  const overlay = document.getElementById('bookDetail');

  if (book && !overlay.classList.contains('visible')) {
    const title = book.querySelector('.book__title').textContent;
    const author = book.querySelector('.book__author').textContent;
    const tex = book.querySelector('.book__spine').style.backgroundImage;

    document.getElementById('bd-title').textContent = title;
    document.getElementById('bd-author').textContent = author;
    document.getElementById('bd-cover').style.backgroundImage = tex;

    overlay.classList.add('visible');
  } else if (!e.target.closest('.book-detail__card')) {
    overlay.classList.remove('visible');
  }
});
</script>

</body>
</html>
