<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Door Concept Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --font-heading: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
    --font-body: 'EB Garamond', Georgia, serif;
    --text: #e8dcc8;
    --text-muted: #a09070;
    --bg-dark: #1a1208;
    --accent: #7a9e6e;
    --gold: #c8a050;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: #0a0806;
    color: var(--text);
    min-height: 100vh;
  }

  /* -- Concept Switcher -- */
  .switcher {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(10, 8, 6, 0.95);
    border-bottom: 1px solid rgba(200, 160, 80, 0.2);
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  .switcher button {
    font-family: var(--font-heading);
    font-size: 0.9rem;
    padding: 0.4rem 1rem;
    border: 1px solid rgba(200, 160, 80, 0.3);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.3s;
  }

  .switcher button:hover {
    border-color: var(--gold);
    color: var(--text);
  }

  .switcher button.active {
    background: rgba(200, 160, 80, 0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  .switcher .variant-group {
    display: flex;
    gap: 0.25rem;
    align-items: center;
  }

  .switcher .variant-group .group-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-right: 0.25rem;
  }

  /* -- Login Page -- */
  .page--login {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 5rem 1rem 2rem;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(74, 60, 40, 0.15), transparent 70%),
      linear-gradient(180deg, #1a1208 0%, #2a1f14 50%, #1a1208 100%);
    overflow: hidden;
    transition: opacity 0.8s ease-out;
  }

  .login-entrance {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    max-width: 440px;
    width: 100%;
  }

  /* -- Door (image-based) -- */
  .login-door {
    position: relative;
    width: 300px;
    height: 380px;
    margin: 0 auto;
    perspective: 1200px;
    cursor: pointer;
  }

  .login-door__image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: brightness(0.85) contrast(1.1);
    transition: filter 0.5s, transform 0.5s;
    transform-style: preserve-3d;
  }

  .login-door:hover .login-door__image {
    filter: brightness(1.0) contrast(1.1);
    transform: scale(1.02);
  }

  .login-door__glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(
      ellipse,
      rgba(255, 220, 140, 0.5) 0%,
      rgba(255, 200, 100, 0.15) 40%,
      transparent 70%
    );
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 1.2s ease-out, height 1.2s ease-out, opacity 1.2s ease-out;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  /* Opening animation */
  .door-opening .login-door__image {
    animation: doorSwingOpen 1.4s ease-in-out forwards;
  }

  .door-opening .login-door__glow {
    width: 500px;
    height: 500px;
    opacity: 1;
  }

  .door-opening .login-form-area {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: opacity 0.6s ease-in, transform 0.8s ease-in;
  }

  /* The door opens and we "move through" it */
  @keyframes doorSwingOpen {
    0% { transform: scale(1) perspective(1200px) rotateY(0deg); filter: brightness(0.85); }
    30% { transform: scale(1.05) perspective(1200px) rotateY(-15deg); filter: brightness(1.0); }
    60% { transform: scale(1.3) perspective(800px) rotateY(-45deg); filter: brightness(1.5); }
    80% { transform: scale(2.0) perspective(600px) rotateY(-65deg); filter: brightness(2.0); opacity: 0.5; }
    100% { transform: scale(3.0) perspective(400px) rotateY(-80deg); filter: brightness(3.0); opacity: 0; }
  }

  .door-opening .page--login {
    animation: fadeToLight 1.8s ease-in forwards;
  }

  @keyframes fadeToLight {
    0% { background: linear-gradient(180deg, #1a1208 0%, #2a1f14 50%, #1a1208 100%); }
    70% { background: linear-gradient(180deg, #3d2b1f 0%, #5c4a36 50%, #c8a050 100%); }
    100% { background: #ffeebb; opacity: 0; }
  }

  /* -- Form area -- */
  .login-form-area {
    width: 100%;
    text-align: center;
    transition: opacity 0.4s, transform 0.4s;
  }

  .login-form__heading {
    font-family: var(--font-heading);
    font-size: 2.2rem;
    color: var(--text);
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
  }

  .login-form__subheading {
    font-family: var(--font-heading);
    font-style: italic;
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    padding: 1.5rem;
    background: rgba(26, 18, 8, 0.6);
    border: 1px solid rgba(92, 74, 54, 0.3);
    border-radius: 8px;
    backdrop-filter: blur(4px);
  }

  .login-form__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid rgba(92, 74, 54, 0.3);
    margin-bottom: 0.5rem;
  }

  .login-form__tab {
    flex: 1;
    padding: 0.6rem;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-heading);
    font-size: 1rem;
    cursor: pointer;
    transition: color 0.3s, border-bottom 0.3s;
    border-bottom: 2px solid transparent;
  }

  .login-form__tab:hover {
    color: var(--text);
  }

  .login-form__tab--active {
    color: var(--gold);
    border-bottom: 2px solid var(--gold);
  }

  .login-form__field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-align: left;
  }

  .login-form__label {
    font-family: var(--font-heading);
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .login-form__input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: rgba(42, 31, 20, 0.6);
    border: 1px solid rgba(92, 74, 54, 0.4);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .login-form__input::placeholder {
    color: rgba(160, 144, 112, 0.5);
    font-style: italic;
  }

  .login-form__input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(200, 160, 80, 0.15);
  }

  .login-form__submit {
    padding: 0.8rem 2rem;
    border: 1px solid rgba(122, 158, 110, 0.4);
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(122, 158, 110, 0.2), rgba(122, 158, 110, 0.1));
    color: var(--accent);
    font-family: var(--font-heading);
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 0.5rem;
  }

  .login-form__submit:hover {
    background: linear-gradient(135deg, rgba(122, 158, 110, 0.3), rgba(122, 158, 110, 0.15));
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(122, 158, 110, 0.15);
  }

  /* -- Concept label -- */
  .concept-label {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-heading);
    font-size: 0.85rem;
    color: var(--text-muted);
    background: rgba(10, 8, 6, 0.8);
    padding: 0.5rem 1.5rem;
    border-radius: 20px;
    border: 1px solid rgba(200, 160, 80, 0.2);
    z-index: 100;
  }
</style>
</head>
<body>

<div class="switcher" id="switcher"></div>

<div class="page--login" id="loginPage">
  <div class="login-entrance">
    <div class="login-door" id="door" onclick="animateDoor()">
      <img class="login-door__image" id="doorImage" src="door-dark-academia.png" alt="Library door">
      <div class="login-door__glow"></div>
    </div>

    <div class="login-form-area">
      <h1 class="login-form__heading">The Stacks</h1>
      <p class="login-form__subheading">Present your credentials to enter</p>

      <div class="login-form">
        <div class="login-form__tabs">
          <button class="login-form__tab login-form__tab--active">Sign In</button>
          <button class="login-form__tab">Register</button>
        </div>

        <div class="login-form__field">
          <label class="login-form__label">Email</label>
          <input class="login-form__input" type="email" placeholder="you@example.com">
        </div>

        <div class="login-form__field">
          <label class="login-form__label">Password</label>
          <input class="login-form__input" type="password" placeholder="Enter your password">
        </div>

        <button class="login-form__submit" onclick="animateDoor()">Enter the Stacks</button>
      </div>
    </div>
  </div>
</div>

<div class="concept-label" id="conceptLabel">Dark Academia — v1</div>

<script>
const concepts = {
  'Dark Academia': [
    { file: 'door-dark-academia.png', label: 'v1 — Gothic carved mahogany, brass knocker' },
    { file: 'door-dark-academia-v2.png', label: 'v2 — University library, bronze lion knockers' },
    { file: 'door-dark-academia-v3.png', label: 'v3 — Narrow Gothic ebony, iron scrollwork' },
  ],
  'Cottage Core': [
    { file: 'door-cottage-core.png', label: 'v1 — Pale oak, lavender wreath, stained glass' },
    { file: 'door-cottage-core-v2.png', label: 'v2 — Dutch split door, wisteria, herb shelf' },
    { file: 'door-cottage-core-v3.png', label: 'v3 — Round hobbit door, wildflowers, lantern' },
  ],
  'Blended': [
    { file: 'door-blended.png', label: 'v1 — Walnut, ivy + Gothic arch, art nouveau brass' },
    { file: 'door-blended-v2.png', label: 'v2 — Living stone frame, ferns, chamomile threshold' },
    { file: 'door-blended-v3.png', label: 'v3 — Botanical stained glass, Pre-Raphaelite style' },
  ],
  'Dragon Eye': [
    { file: 'door-dragon-eye.png', label: 'v1 — Amber dragon eye knocker, scaled frame, runes' },
    { file: 'door-dragon-eye-v2.png', label: 'v2 — Subtle relief carving, leather panels, ember glow' },
    { file: 'door-dragon-eye-v3.png', label: 'v3 — Dragon body forms the arch, sleeping guardian' },
  ],
  'Secret Passage': [
    { file: 'door-secret-passage.png', label: 'v1 — Bookshelf door ajar, golden light behind' },
    { file: 'door-secret-passage-v2.png', label: 'v2 — Study bookshelf, tilted trigger book' },
    { file: 'door-secret-passage-v3.png', label: 'v3 — Spiral staircase behind bookshelf door' },
  ],
};

const switcher = document.getElementById('switcher');
const doorImage = document.getElementById('doorImage');
const conceptLabel = document.getElementById('conceptLabel');
let activeButton = null;

// Build switcher buttons
Object.entries(concepts).forEach(([group, variants]) => {
  const groupDiv = document.createElement('div');
  groupDiv.className = 'variant-group';

  const groupLabel = document.createElement('span');
  groupLabel.className = 'group-label';
  groupLabel.textContent = group;
  groupDiv.appendChild(groupLabel);

  variants.forEach((variant, i) => {
    const btn = document.createElement('button');
    btn.textContent = `v${i + 1}`;
    btn.title = variant.label;
    btn.onclick = () => {
      if (activeButton) activeButton.classList.remove('active');
      btn.classList.add('active');
      activeButton = btn;
      doorImage.src = variant.file;
      conceptLabel.textContent = `${group} — ${variant.label}`;
      // Reset animation
      document.getElementById('loginPage').classList.remove('door-opening');
    };
    if (group === 'Dark Academia' && i === 0) {
      btn.classList.add('active');
      activeButton = btn;
    }
    groupDiv.appendChild(btn);
  });

  switcher.appendChild(groupDiv);
});

function animateDoor() {
  const page = document.getElementById('loginPage');
  page.classList.add('door-opening');

  setTimeout(() => {
    page.classList.remove('door-opening');
  }, 2500);
}
</script>

</body>
</html>
