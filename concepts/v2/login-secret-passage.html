<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Secret Passage Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --font-heading: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
    --font-body: 'EB Garamond', Georgia, serif;
    --text: #e8dcc8;
    --text-muted: #a09070;
    --bg-dark: #1a1208;
    --accent: #7a9e6e;
    --gold: #c8a050;
    --parchment: #f5eed6;
    --parchment-dark: #e8dcc0;
    --ink: #2c1f0e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: #0a0806;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ========================================
     LAYER 1: The bookshelf wall (always visible)
     ======================================== */
  .bookshelf-wall {
    position: fixed;
    inset: 0;
    background-image: url('bookshelf-wide-panoramic.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    /* Darken slightly so form is readable */
    filter: brightness(0.6);
    transition: filter 1.5s ease-out;
  }

  /* Vignette overlay */
  .bookshelf-wall::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at 50% 50%,
      transparent 30%,
      rgba(10, 8, 6, 0.6) 100%
    );
    pointer-events: none;
  }

  /* ========================================
     LAYER 2: The login form (catalogue card)
     ======================================== */
  .login-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.6s ease-out, transform 0.8s ease-out;
  }

  .login-card {
    max-width: 400px;
    width: 90%;
    background: linear-gradient(
      145deg,
      var(--parchment) 0%,
      var(--parchment-dark) 100%
    );
    border-radius: 4px;
    padding: 2.5rem 2rem 2rem;
    color: var(--ink);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.5),
      0 2px 8px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    /* Subtle paper texture via noise */
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"),
      linear-gradient(145deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    position: relative;
  }

  /* Catalogue card top edge — red line like a library card */
  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b4513, #a0522d, #8b4513);
    border-radius: 4px 4px 0 0;
  }

  .login-card__title {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    margin-bottom: 0.25rem;
    letter-spacing: 0.06em;
  }

  .login-card__subtitle {
    font-family: var(--font-heading);
    font-style: italic;
    font-size: 0.95rem;
    color: #6b5a45;
    text-align: center;
    margin-bottom: 1.75rem;
  }

  .login-card__tabs {
    display: flex;
    border-bottom: 1px solid #c8b89a;
    margin-bottom: 1.25rem;
  }

  .login-card__tab {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: transparent;
    color: #8b7a65;
    font-family: var(--font-heading);
    font-size: 1rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
  }

  .login-card__tab:hover {
    color: var(--ink);
  }

  .login-card__tab--active {
    color: #5c3a1e;
    border-bottom-color: #8b4513;
  }

  .login-card__field {
    margin-bottom: 1.25rem;
  }

  .login-card__label {
    display: block;
    font-family: var(--font-heading);
    font-size: 0.8rem;
    color: #6b5a45;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .login-card__input {
    width: 100%;
    padding: 0.7rem 0.75rem;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid #c8b89a;
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .login-card__input::placeholder {
    color: #a09580;
    font-style: italic;
  }

  .login-card__input:focus {
    outline: none;
    border-color: #8b4513;
    box-shadow: 0 0 0 2px rgba(139, 69, 19, 0.15);
  }

  .login-card__submit {
    width: 100%;
    padding: 0.75rem;
    margin-top: 0.5rem;
    border: 1px solid #5c3a1e;
    border-radius: 3px;
    background: linear-gradient(135deg, #5c3a1e, #3d2610);
    color: var(--parchment);
    font-family: var(--font-heading);
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.3s;
  }

  .login-card__submit:hover {
    background: linear-gradient(135deg, #6b4525, #4a2e15);
    box-shadow: 0 2px 12px rgba(92, 58, 30, 0.3);
  }

  /* ========================================
     LAYER 3: The secret door opening
     ======================================== */
  .door-reveal {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .door-reveal.active {
    opacity: 1;
  }

  .door-reveal__left,
  .door-reveal__right {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background-image: url('bookshelf-wide-panoramic.png');
    background-size: 100vw 100vh;
    background-repeat: no-repeat;
    transition: transform 1.8s cubic-bezier(0.25, 0.1, 0.25, 1);
    filter: brightness(0.7);
  }

  .door-reveal__left {
    left: 0;
    background-position: left center;
    transform-origin: left center;
  }

  .door-reveal__right {
    right: 0;
    background-position: right center;
    transform-origin: right center;
  }

  .door-reveal.opening .door-reveal__left {
    transform: perspective(1200px) rotateY(-70deg);
  }

  .door-reveal.opening .door-reveal__right {
    transform: perspective(1200px) rotateY(70deg);
  }

  /* Light flooding in from behind */
  .door-reveal__light {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(255, 230, 160, 0.0) 0%,
      transparent 60%
    );
    transition: background 1.5s ease-out 0.3s;
  }

  .door-reveal.opening .door-reveal__light {
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(255, 230, 160, 0.6) 0%,
      rgba(255, 210, 120, 0.2) 40%,
      transparent 70%
    );
  }

  /* ========================================
     LAYER 4: The passage beyond (destination)
     ======================================== */
  .passage-beyond {
    position: fixed;
    inset: 0;
    z-index: 2;
    background-image: url('passage-beyond.png');
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.1);
    transition: opacity 1.5s ease-out 0.5s, transform 2.5s ease-out 0.5s;
  }

  .passage-beyond.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* ========================================
     PULL-THROUGH ANIMATION
     The camera "moves forward" through the door
     ======================================== */
  .pull-through .bookshelf-wall {
    filter: brightness(0.9);
    transform: scale(1.3);
    transition: filter 1.5s, transform 2.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .pull-through .login-overlay {
    opacity: 0;
    transform: scale(0.8) translateY(-30px);
  }

  /* Final fade to white/warm before "arriving" at the app */
  .arrival {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--parchment);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease-in 2.2s;
  }

  .pull-through .arrival {
    opacity: 1;
  }

  /* ========================================
     IMAGE SWITCHER (for testing)
     ======================================== */
  .switcher {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 0.5rem;
    background: rgba(10, 8, 6, 0.9);
    padding: 0.5rem 1rem;
    border-radius: 20px;
    border: 1px solid rgba(200, 160, 80, 0.2);
  }

  .switcher button {
    font-family: var(--font-heading);
    font-size: 0.8rem;
    padding: 0.3rem 0.75rem;
    border: 1px solid rgba(200, 160, 80, 0.3);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.3s;
  }

  .switcher button:hover {
    border-color: var(--gold);
    color: var(--text);
  }

  .switcher button.active {
    background: rgba(200, 160, 80, 0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  .status-label {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: var(--font-heading);
    font-size: 0.85rem;
    color: var(--text-muted);
    background: rgba(10, 8, 6, 0.8);
    padding: 0.4rem 1.2rem;
    border-radius: 20px;
    border: 1px solid rgba(200, 160, 80, 0.2);
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<!-- LAYER 1: Bookshelf wall background -->
<div class="bookshelf-wall" id="bookshelfWall"></div>

<!-- LAYER 4: Passage beyond (hidden initially) -->
<div class="passage-beyond" id="passageBeyond"></div>

<!-- LAYER 3: Door reveal panels (hidden initially) -->
<div class="door-reveal" id="doorReveal">
  <div class="door-reveal__left"></div>
  <div class="door-reveal__right"></div>
  <div class="door-reveal__light"></div>
</div>

<!-- LAYER 2: Login form overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1 class="login-card__title">The Stacks</h1>
    <p class="login-card__subtitle">Present your credentials to enter</p>

    <div class="login-card__tabs">
      <button class="login-card__tab login-card__tab--active" onclick="switchTab(this, 'login')">Sign In</button>
      <button class="login-card__tab" onclick="switchTab(this, 'register')">Register</button>
    </div>

    <div id="nameField" style="display:none">
      <div class="login-card__field">
        <label class="login-card__label">Display Name</label>
        <input class="login-card__input" type="text" placeholder="Your name">
      </div>
    </div>

    <div class="login-card__field">
      <label class="login-card__label">Email</label>
      <input class="login-card__input" type="email" placeholder="you@example.com">
    </div>

    <div class="login-card__field">
      <label class="login-card__label">Password</label>
      <input class="login-card__input" type="password" placeholder="Enter your password">
    </div>

    <button class="login-card__submit" onclick="authenticate()">Enter the Stacks</button>
  </div>
</div>

<!-- Final arrival fade -->
<div class="arrival" id="arrival"></div>

<!-- Status -->
<div class="status-label" id="statusLabel">Bookshelf wall — click "Enter" to see the secret passage open</div>

<!-- Background image switcher -->
<div class="switcher">
  <button class="active" onclick="switchBg(this, 'bookshelf-wide-panoramic.png')">Panoramic</button>
  <button onclick="switchBg(this, 'bookshelf-wall-closed.png')">Wall v1</button>
  <button onclick="switchBg(this, 'bookshelf-closeup-center.png')">Closeup</button>
  <button onclick="resetAnimation()">⟲ Reset</button>
</div>

<script>
function switchTab(btn, mode) {
  document.querySelectorAll('.login-card__tab').forEach(t => t.classList.remove('login-card__tab--active'));
  btn.classList.add('login-card__tab--active');
  document.getElementById('nameField').style.display = mode === 'register' ? 'block' : 'none';
}

let activeBgBtn = document.querySelector('.switcher button.active');

function switchBg(btn, file) {
  if (activeBgBtn) activeBgBtn.classList.remove('active');
  btn.classList.add('active');
  activeBgBtn = btn;

  const wall = document.getElementById('bookshelfWall');
  wall.style.backgroundImage = `url('${file}')`;

  // Also update door reveal panels
  document.querySelector('.door-reveal__left').style.backgroundImage = `url('${file}')`;
  document.querySelector('.door-reveal__right').style.backgroundImage = `url('${file}')`;
}

function authenticate() {
  const body = document.body;
  const doorReveal = document.getElementById('doorReveal');
  const passageBeyond = document.getElementById('passageBeyond');
  const statusLabel = document.getElementById('statusLabel');

  // Phase 1: Card fades, door reveal panels appear
  statusLabel.textContent = 'Credentials accepted... the bookshelf stirs...';
  body.classList.add('pull-through');
  doorReveal.classList.add('active');

  // Phase 2: Door panels swing open (after card has faded)
  setTimeout(() => {
    statusLabel.textContent = 'A hidden passage reveals itself...';
    doorReveal.classList.add('opening');
    passageBeyond.classList.add('visible');
  }, 800);

  // Phase 3: Pull through into the passage
  setTimeout(() => {
    statusLabel.textContent = 'Stepping through into the library...';
    statusLabel.style.opacity = '0';
  }, 2200);

  // Phase 4: Arrival (would redirect to /antilibrary in real app)
  setTimeout(() => {
    // In real app: window.location = '/bookshelves/antilibrary'
    statusLabel.textContent = 'Arrived. Welcome to The Stacks.';
    statusLabel.style.opacity = '1';
    statusLabel.style.color = '#5c3a1e';
    statusLabel.style.background = 'rgba(245, 238, 214, 0.9)';
  }, 3200);
}

function resetAnimation() {
  const body = document.body;
  body.classList.remove('pull-through');
  document.getElementById('doorReveal').classList.remove('active', 'opening');
  document.getElementById('passageBeyond').classList.remove('visible');
  document.getElementById('arrival').style.opacity = '0';

  const label = document.getElementById('statusLabel');
  label.textContent = 'Bookshelf wall — click "Enter" to see the secret passage open';
  label.style.opacity = '1';
  label.style.color = '';
  label.style.background = '';
}
</script>

</body>
</html>
