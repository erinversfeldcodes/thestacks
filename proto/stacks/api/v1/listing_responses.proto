// listing_responses.proto — Marketplace listing response types for The Stacks API.
// JSON on the wire. Field numbers are forever — never reuse a number.
syntax = "proto3";

package stacks.api.v1;

import "stacks/common/v1/listing.proto";

// ListingResponse wraps a single marketplace listing.
// JSON shape: {listing: {...}}
message ListingResponse {
  // The listing (serialized via Jason.Encoder derive on the Listing schema).
  stacks.common.v1.Listing listing = 1 [json_name = "listing"];
}

// ListingListResponse is returned by GET /api/listings and GET /api/listings/mine.
// JSON shape: {listings: [...]}
message ListingListResponse {
  // List of marketplace listings.
  repeated stacks.common.v1.Listing listings = 1 [json_name = "listings"];
}
