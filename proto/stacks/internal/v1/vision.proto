// vision.proto — Inter-service contracts for the vision sidecar (Python/FastAPI).
// JSON on the wire. Field numbers are forever — never reuse a number.
syntax = "proto3";

package stacks.internal.v1;

// Classification result returned by the vision model for a cover image.
enum ClassificationResult {
  // Zero value — classification not set.
  CLASSIFICATION_RESULT_UNSPECIFIED = 0;
  // Image contains a book cover.
  CLASSIFICATION_RESULT_BOOK = 1;
  // Image does not contain a book cover.
  CLASSIFICATION_RESULT_NOT_BOOK = 2;
  // Classification is inconclusive.
  CLASSIFICATION_RESULT_AMBIGUOUS = 3;
}


// ⚠️ The async cover-association contract — `AssociateRequest`, `AssociateResponse`,
// `AssociateCallback` and `enum AssociationStatus` — was DELETED on 2026-10-16,
// reversing an earlier decision to retain it unused for the vision redesign.
//
// Retaining it was costing live artefacts in three languages on every build with
// zero hand-written consumers, and buying nothing in return — because the
// messages were never deleted, standing up a served `/associate` would not have
// been a proto change at all, so `buf breaking` would have reported NOTHING for
// precisely the change that most needs flagging. A contract kept to protect a
// future reintroduction was instead silencing the gate that should announce it.
//
// When the redesign needs this, re-derive the shape against the sidecar that
// will actually serve it and get a contract review on the reintroduction. What
// was here is in git history; what the service will need is a question for then.

// Why a request to the vision service could not be answered.
//
// Every value here names a DETERMINISTIC failure: the same bytes sent again
// produce the same answer, so the caller must stop rather than retry. That is
// the whole reason the enum exists. Before it, a corrupt upload and a Modal
// cold-start timeout were both "the vision call failed", and Oban spent three
// GPU attempts re-proving that a JPEG header is still not a JPEG header.
//
// Transient faults deliberately have NO value here. They are carried by the
// HTTP status alone (5xx, a refused connection, a blown breaker) and stay
// retryable. Adding a transient value to this enum would be a category error:
// `Stacks.AI.VisionError` maps every value below to a cancel.
enum VisionErrorCode {
  // Zero value — unset. Never sent deliberately; a response carrying it is
  // treated as an unrecognised code, which is retryable and counted.
  VISION_ERROR_CODE_UNSPECIFIED = 0;
  // The bytes are not a decodable image — invalid base64, a truncated file,
  // or a format the service cannot open.
  VISION_ERROR_CODE_UNDECODABLE_IMAGE = 1;
  // The image decoded but exceeds the service's size ceiling.
  VISION_ERROR_CODE_IMAGE_TOO_LARGE = 2;
  // The `image_url` could not be fetched: a non-200 from storage, a redirect
  // (never followed — SSRF guard), or a body over the download cap. The
  // presigned URL in hand will not start working within one job's lifetime.
  VISION_ERROR_CODE_IMAGE_UNREACHABLE = 3;
  // ⚠️ UNREACHABLE as of 2026-10-15 — nothing can send this, and the value is
  // retained deliberately rather than removed.
  //
  // It meant "neither `image` nor `image_url` was supplied". That condition is
  // now caught earlier: `AnalyzeRequest` declares the two as a `oneof`, so the
  // request fails schema validation before any handler body runs and the caller
  // receives MALFORMED_REQUEST instead. The only remaining raise site in the
  // sidecar is defensive and cannot be reached through `/analyze`. The endpoint
  // that could reach it, `/extract`, was deleted the same day.
  //
  // It stays because removing an enum value is a wire-contract change, and
  // because the sidecar pins its constant set against this enum. A rebuilt
  // two-input endpoint could make it reachable again — but until then, do NOT
  // write a client branch for it expecting traffic.
  VISION_ERROR_CODE_NO_IMAGE_SUPPLIED = 4;
  // The request violates a constraint that is not about the image bytes at all:
  // today, `image` and `image_url` both set, or neither set, since
  // `AnalyzeRequest` declares them as a `oneof`.
  //
  // ⚠️ This comment described a `repeated images` field ("more `images` than
  // the endpoint accepts") until 2026-10-15 and was the last live reference to
  // it anywhere in this contract; that field went with `ExtractRequest`.
  //
  // ⚠️ It also promised an operator distinction that can no longer be drawn.
  // It said this code is kept separate from NO_IMAGE_SUPPLIED so a counter can
  // tell "core sent nothing" from "core sent a contradiction". Both now arrive
  // here: the oneof rejects the empty case before a handler runs. The two codes
  // remain distinct VALUES — NO_IMAGE_SUPPLIED is unreachable, see above — but
  // the counter no longer separates those two causes, and an operator should
  // read the message text rather than the code to tell them apart.
  VISION_ERROR_CODE_MALFORMED_REQUEST = 5;
}

// Error body returned by any vision endpoint that fails deterministically.
// Replaces FastAPI's default `{"detail": "<prose>"}` for these cases so the
// caller branches on a value from a closed set rather than parsing English.
message VisionError {
  // Which deterministic failure occurred; see VisionErrorCode.
  VisionErrorCode code = 1 [json_name = "code"];
  // Human-readable detail, for logs and operator eyes. NEVER parsed.
  string message = 2 [json_name = "message"];
}

// The ClassifyRequest/ClassifyResponse and ExtractRequest/ExtractResponse
// message pairs stood here until 2026-10-15. They described two HTTP endpoints
// on the vision sidecar, superseded by a single /analyze call.
//
// Why they went: they had NO CALLER in any revision — core has always asked
// /analyze — and the vision architecture decision rules the two-call HTTP shape
// superseded in principle.
// ⚠️ Deleting them saved no latency, and an earlier version of this comment
// wrongly claimed it did, borrowing a "2-4s inter-call gap at p95=7.7s" figure
// from the architecture decision that chose this stack.
// That measurement is about two MODAL method invocations, not two HTTP
// endpoints, and /analyze still makes both: `main.py` calls `client.classify`
// and then `client.extract`, two `remote.aio` round-trips with a short-circuit
// between them. That decision's own 2026-05 update records that the single-prompt
// collapse was REVERTED. So the fan-out cost is still live and still unpaid —
// anyone chasing it should look at the /analyze handler, not at this deletion.
//
// There is no message-level `reserved` construct in protobuf — `reserved`
// reserves field NUMBERS and names inside a surviving message, and enum values —
// so nothing is held here on their behalf, and nothing can be.
//
// ⚠️ If the two-call shape ever returns, these messages come back by name and
// their field numbering starts fresh. **That is true HERE and false in general;
// do not carry it to another message.** It holds only because of three facts
// specific to these four:
//   1. Nothing ever encoded them. The endpoints had no caller in any revision —
//      the same fact that justified deleting them — so no payload of these
//      shapes exists anywhere to be mis-decoded.
//   2. This contract is JSON on the wire. Every field carries `json_name`, and
//      the generated Python, Elixir and Elm all identify fields by NAME, so the
//      number is not the wire identity.
//   3. Nothing persists them: `proto/persisted.exs` has no vision entry, so no
//      stored row carries an encoding of these shapes.
// For a message that HAS been on the wire, numbering never starts fresh, and
// reusing a number silently corrupts old data rather than failing loudly.
//
// The concrete trap, recorded because the natural rebuild walks into it: the old
// `ExtractRequest` was `repeated string images = 1` / `optional string image_url = 2`,
// and `ClassifyRequest` was `string image = 1` / `string image_url = 2` (a oneof).
// `AnalyzeRequest` today has `string image = 1`. A rebuilt `ExtractRequest`
// derived from it — the obvious move — would put a SINGULAR string on number 1
// where a REPEATED one used to be. Both encode length-delimited, so a stale
// binary payload would decode silently and wrongly rather than erroring. Harmless
// here only because point 1 above means no such payload exists.
//
// Note the asymmetry with the association set kept below: those are RETAINED, so
// `buf breaking` holds their field numbers immovable for as long as they sit in
// this file. Keeping a contract is the strongest protection against number drift;
// it is the deleted-and-never-encoded case that has nothing to protect.
//
// ClassificationResult and ExtractedBook deliberately SURVIVE: AnalyzeResponse
// is typed on both.

// A book candidate extracted from an image by the vision model.
message ExtractedBook {
  // Book title (absent if not detected).
  optional string title = 1 [json_name = "title"];
  // Author name (absent if not detected).
  optional string author = 2 [json_name = "author"];
  // ISBN candidates found in the image.
  repeated string potential_isbns = 3 [json_name = "potential_isbns"];
  // Raw OCR text from the image region (absent if not extracted).
  optional string raw_text = 4 [json_name = "raw_text"];
  // Extraction confidence (0.0–1.0). Absent when model does not report a score.
  optional double confidence = 5 [json_name = "confidence"];
}

// POST /analyze — single-request classification + extraction.
//
// Combines classification + extraction into one call so core pays for one
// HTTP round-trip. The vision service runs classify internally first; if the
// result is BOOK it proceeds to extract, otherwise returns an empty `books`
// list and skips the expensive extract step. Preserves the pre-consolidation
// short-circuit ("don't run extract on non-books") without forcing core to
// make two HTTP calls.
//
// ⚠️ "One HTTP round-trip" is the accurate claim; this comment also used to say
// "and one potential cold-start on the Modal side", which is NOT true and is
// worth correcting here because it is the same error as the one in the
// deletion note above. The handler invokes TWO Modal methods —
// `client.classify` then `client.extract` — so the Modal-side fan-out and its
// cold-start exposure are unchanged by the HTTP consolidation. Collapsing them
// into a single prompt was tried and REVERTED (recorded in the vision
// architecture decision's 2026-05 update).
message AnalyzeRequest {
  // Base64-encoded image OR URL — mutually exclusive; exactly one must be set.
  oneof input {
    // Base64-encoded image data.
    string image = 1 [json_name = "image"];
    // URL of a remote image.
    string image_url = 2 [json_name = "image_url"];
  }
  // Books the user has already rejected as wrong identifications for this
  // image. Each entry is a human-readable "Title by Author" string. The
  // vision extractor is instructed to pick a different match or return an
  // empty books list. Empty list = unconstrained extraction (the default).
  repeated string excluded_books = 3 [json_name = "excluded_books"];
}

// Response from POST /analyze.
message AnalyzeResponse {
  // Classification result; see ClassificationResult enum.
  ClassificationResult classification = 1 [json_name = "classification"];
  // Confidence score (0.0–1.0).
  double confidence = 2 [json_name = "confidence"];
  // Extracted book candidates. Empty when classification is not BOOK
  // (extraction is skipped in that case).
  repeated ExtractedBook books = 3 [json_name = "books"];
  // Name of the vision model used for inference.
  string model_used = 4 [json_name = "model_used"];

  // Which cascade tier produced this answer.
  //
  // ⛔ WITHOUT THIS THE PER-TIER QUESTION IS UNANSWERABLE, and it is the
  // question the vision redesign turns on. Cost was charged as a flat constant
  // per call regardless of whether a CPU barcode scan answered in milliseconds
  // or a 7B VLM ran on an A10G — so "should a cover-embedding tier exist?"
  // could not be argued from a figure that cannot tell those apart.
  AnalysisTier tier = 5 [json_name = "tier"];

  // Per-stage wall-clock, milliseconds. A stage that did not run is absent.
  StageTimings timings_ms = 6 [json_name = "timings_ms"];

  // Whether the SIDECAR container was cold when this request arrived.
  //
  // ⛔ NAMED FOR THE CONTAINER IT ACTUALLY MEASURES. This was `container_cold`,
  // which read as "the cold start that costs money" and is not what it
  // reports: the FastAPI app runs in the sidecar, whose warmth `modal_app.py`
  // states outright is "independent of the GPU's" — and "the money is in the
  // GPU window". An idle A10G is roughly two orders of magnitude more
  // expensive per second than an idle CPU container, so a field named for the
  // cheap one and read as the expensive one would have put a wrong term in the
  // architecture decision this data exists to inform.
  //
  // ⚖️ It is still worth reporting: a cold sidecar costs an ASGI cold start ON
  // TOP OF whatever the GPU is doing, so it is a real term in request latency
  // — just not the one the cost case turns on. The GPU's own cold start is
  // knowable from `@modal.enter` and is NOT yet plumbed through; that is
  // tracked as remaining work rather than implied by this field.
  //
  // A boolean rather than an age, because the decision it feeds is binary and
  // an age would invite a threshold nobody agreed.
  bool sidecar_cold = 7 [json_name = "sidecar_cold"];

  // Whether the GPU container was cold for this inference.
  //
  // ⛔ THIS IS THE COLD START THAT COSTS MONEY, and it is a different fact from
  // `sidecar_cold`. An idle A10G is roughly two orders of magnitude more
  // expensive per second than the idle CPU container the sidecar runs in, so
  // these must not be conflated — the field above was briefly the only one and
  // would have put the cheap container's warmth into the architecture
  // decision.
  //
  // ⚖️ Absent, not false, when no GPU ran: a barcode-tier answer never woke the
  // model, and reporting `false` would say "the GPU was warm" about a request
  // that never touched it.
  optional bool gpu_cold = 8 [json_name = "gpu_cold"];

  // How long the GPU container had been alive when this inference started.
  //
  // ⚖️ Seconds alongside the boolean because they answer different questions:
  // `gpu_cold` says whether this request paid the load, and the age says how
  // long the container has been billing — which is what the idle-cost figure
  // is derived from. Absent when no GPU ran.
  optional double gpu_container_age_s = 9 [json_name = "gpu_container_age_s"];
}

// AnalysisTier names the cascade stage that produced an answer.
//
// ⛔ THE NUMBERS ARE IDENTITY, NOT SEQUENCE, AND MUST NOT BE COMPARED
// ORDINALLY. The cascade runs barcode → cover-embedding → OCR → VLM, and it is
// tempting to let these numbers carry that order. They must not: a consumer
// comparing them numerically breaks the moment a tier is inserted out of
// order, and `buf` will never flag it because the numbers stayed perfectly
// valid. Order the cascade explicitly in code; let these be arbitrary.
//
// ⚖️ EMBEDDING and OCR are therefore NOT reserved space. Appending an enum
// value is additive and allowed, so a future tier simply takes the next free
// number — gaps buy nothing.
enum AnalysisTier {
  // Unset. A producer that has not been taught to report its tier, which is
  // distinct from any real tier and must not be counted as one.
  ANALYSIS_TIER_UNSPECIFIED = 0;

  // A barcode decoded on CPU, before any model ran.
  ANALYSIS_TIER_BARCODE = 1;

  // The VLM answered the classify question and extraction was skipped.
  ANALYSIS_TIER_VLM_CLASSIFY = 2;

  // The VLM ran the full extract path.
  ANALYSIS_TIER_VLM_EXTRACT = 3;
}

// StageTimings carries per-stage wall-clock in milliseconds.
//
// ⚖️ Each stage is optional: a request answered by the barcode tier never runs
// classify or extract, and reporting 0 for a stage that did not run would be
// indistinguishable from one that ran instantly. Absent means "did not run".
message StageTimings {
  // Fetching or decoding the image.
  optional int32 download = 1 [json_name = "download"];

  // The CPU barcode pre-pass.
  optional int32 barcode = 2 [json_name = "barcode"];

  // The VLM classify call.
  optional int32 classify = 3 [json_name = "classify"];

  // The VLM extract call.
  optional int32 extract = 4 [json_name = "extract"];
}

// Cover association: request, response, callback and status enum.
//
