// audit.proto — Audit log entry for tracking user actions on the platform.
// JSON on the wire. Field numbers are forever — never reuse a number.
syntax = "proto3";

package stacks.internal.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// AuditEntry records a user action in the audit.audit_log table.
// INSERT-only — never updated or deleted.
message AuditEntry {
  // UUID of the user who performed the action.
  string user_id = 1 [json_name = "user_id"];

  // The action performed (e.g. "create", "update", "delete").
  string action = 2 [json_name = "action"];

  // Type of the resource acted upon (e.g. "book", "listing").
  string resource_type = 3 [json_name = "resource_type"];

  // UUID of the resource acted upon.
  string resource_id = 4 [json_name = "resource_id"];

  // IP address of the client that performed the action.
  string ip_address = 5 [json_name = "ip_address"];

  // Additional metadata about the action (stored as JSONB).
  google.protobuf.Struct metadata = 6 [json_name = "metadata"];

  // When the action occurred (UTC).
  google.protobuf.Timestamp occurred_at = 7 [json_name = "occurred_at"];

  // Admin-call shape — Phase 1 (break-glass prod data access).
  // All nullable: existing call sites that omit these opts store NULL.

  // API endpoint invoked by the admin call (e.g. "/api/admin/users/by_email").
  string endpoint = 8 [json_name = "endpoint"];

  // Round-trip latency of the admin call in milliseconds.
  int32 latency_ms = 9 [json_name = "latency_ms"];

  // Whether the admin call succeeded (false = error or empty result).
  bool success = 10 [json_name = "success"];

  // Number of rows returned or affected by the admin call.
  int32 row_count = 11 [json_name = "row_count"];

  // UUID of the admin session that issued this call.
  string operator_session_id = 12 [json_name = "operator_session_id"];
}
