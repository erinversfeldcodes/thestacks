// book.proto — Shared book, edition, author, and ISBN types used across domains.
// JSON on the wire. Field numbers are forever — never reuse a number.
syntax = "proto3";

package stacks.common.v1;

option java_package = "com.thestacks.common.v1";
option java_outer_classname = "BookProto";
option java_multiple_files = true;

// ISBNFormat distinguishes the two standard ISBN formats.
enum ISBNFormat {
  // Default unspecified value; should not be used in practice.
  ISBN_FORMAT_UNSPECIFIED = 0;
  // The 10-digit ISBN format (older standard, pre-2007).
  ISBN_FORMAT_ISBN_10 = 1;
  // The 13-digit ISBN format (current standard, EAN-13 compatible).
  ISBN_FORMAT_ISBN_13 = 2;
}

// EditionFormat represents the physical or digital form of a book edition.
enum EditionFormat {
  // Default unspecified value; should not be used in practice.
  EDITION_FORMAT_UNSPECIFIED = 0;
  // A hardcover (case-bound) physical edition.
  EDITION_FORMAT_HARDCOVER = 1;
  // A paperback (perfect-bound or saddle-stitched) physical edition.
  EDITION_FORMAT_PAPERBACK = 2;
  // A digital e-book edition (e.g. EPUB, MOBI, PDF).
  EDITION_FORMAT_EBOOK = 3;
  // An audio recording of the book.
  EDITION_FORMAT_AUDIOBOOK = 4;
  // A large-print physical edition for accessibility.
  EDITION_FORMAT_LARGE_PRINT = 5;
}

// VisibilityTier controls who can see a book or placement.
enum VisibilityTier {
  // Default unspecified value; should not be used in practice.
  VISIBILITY_TIER_UNSPECIFIED = 0;
  // Visible to all users and search engines.
  VISIBILITY_TIER_PUBLIC = 1;
  // Accessible via direct link but not listed in public discovery.
  VISIBILITY_TIER_UNLISTED = 2;
  // Visible only to the owning user.
  VISIBILITY_TIER_PRIVATE = 3;

  // Restricted to users who have verified their age.
  VISIBILITY_TIER_AGE_GATED = 4;
}

// ISBN is a verified book identifier. The hard gate: no book enters the system
// without a verified ISBN from Open Library or Google Books.
// Note: this message is used for structured ISBN validation (e.g. partner ingestion).
// API responses from Edition use a plain string isbn field for simplicity.
message ISBN {
  // The raw ISBN value (digits only, no hyphens).
  string value = 1 [json_name = "value"];

  // Whether this is an ISBN-10 or ISBN-13.
  ISBNFormat format = 2 [json_name = "format"];
}

// Author represents a person who wrote or contributed to a book (work-level).
//
// JSON wire mapping (controllers send subsets of these fields; absent fields
// default to proto3 zero values — empty string for strings):
//   - BookController sends: {id, name, bio, website}
//   - BookshelfController sends: {id, name, bio} (website absent, defaults to "")
//   - SearchController/CatalogueController send: {id, name} (bio, website absent)
message Author {
  // UUID of the author record.
  string id = 1 [json_name = "id"];

  // Full display name of the author.
  string name = 2 [json_name = "name"];

  // Optional author website URL.
  // Controller serializes author.website_url as JSON key "website".
  string website = 3 [json_name = "website"];

  // Optional RSS/Atom feed URL for the author's blog or newsletter.
  string rss_feed_url = 4 [json_name = "rss_feed_url"];

  // Short biographical description of the author.
  string bio = 5 [json_name = "bio"];
}

// Book represents a work (the abstract creative work, not a specific edition).
// A work may have many editions (different ISBNs, formats, publishers).
//
// This is the rich Book shape sent by all controllers:
//   - BookController.format_book/2: all fields populated
//   - SearchController: omits description, subjects, bisac_codes, language, community_read_count
//   - CatalogueController: omits description, bisac_codes, language, community_read_count
//   - BookshelfController: omits subjects, bisac_codes, language, community_read_count
// Absent fields default to proto3 zero values (empty string, 0, empty list).
message Book {
  // UUID of the book (work) record.
  string id = 1 [json_name = "id"];

  // Title of the work.
  string title = 2 [json_name = "title"];

  // Reserved: field 3 was author_id, removed — use embedded author instead.
  reserved 3;
  reserved "author_id";

  // Short description or blurb for the work.
  string description = 4 [json_name = "description"];

  // Subject/genre tags (e.g. "fiction", "philosophy").
  repeated string subjects = 5 [json_name = "subjects"];

  // Who can see this book on the platform.
  VisibilityTier visibility_tier = 6 [json_name = "visibility_tier"];

  // The primary author of this work (embedded, not an ID reference).
  Author author = 7 [json_name = "author"];

  // All known editions of this book.
  repeated Edition editions = 8 [json_name = "editions"];

  // Total number of editions for this book (convenience, equals len(editions)).
  int32 edition_count = 9 [json_name = "edition_count"];

  // The preferred/canonical edition for display.
  Edition primary_edition = 10 [json_name = "primary_edition"];

  // Number of users across the platform who have read this book.
  int32 community_read_count = 11 [json_name = "community_read_count"];

  // BCP 47 language code for the work (e.g. "en", "af").
  string language = 12 [json_name = "language"];

  // BISAC subject codes for trade classification.
  repeated string bisac_codes = 13 [json_name = "bisac_codes"];
}

// Edition represents a specific ISBN/format/publisher combination of a Book work.
//
// Note: book_id (field 2) and format (field 4) were removed because
// BookController.format_edition/1 does not send them on the wire.
// They are domain-internal fields tracked in the database but not serialized.
message Edition {
  // UUID of the edition record.
  string id = 1 [json_name = "id"];

  // Reserved: field 2 was book_id — domain-internal, not sent on wire.
  reserved 2;
  reserved "book_id";

  // Verified ISBN string for this edition (plain string, e.g. "9780140449136").
  // The ISBN hard gate applies — no edition enters the system without verification.
  string isbn = 3 [json_name = "isbn"];

  // Reserved: field 4 was format (EditionFormat enum) — domain-internal, not sent on wire.
  // The wire representation uses format_label (field 10) instead.
  reserved 4;
  reserved "format";

  // Whether this is the canonical/preferred edition for the work.
  bool is_primary = 5 [json_name = "is_primary"];

  // URL of the cover image (may be empty if not yet fetched).
  string cover_image_url = 6 [json_name = "cover_image_url"];

  // Total page count for print editions (0 if unknown or not applicable).
  int32 page_count = 7 [json_name = "page_count"];

  // Publisher name.
  string publisher = 8 [json_name = "publisher"];

  // Year of publication for this edition (4-digit year, e.g. 2024).
  int32 publication_year = 9 [json_name = "publication_year"];

  // Human-readable format label for API compatibility (e.g. "Hardcover", "Paperback").
  string format_label = 10 [json_name = "format_label"];
}
