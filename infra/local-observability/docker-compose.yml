name: stacks-observability
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    command:
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-retentionPeriod=1"            # months; plenty for local
      - "-selfScrapeInterval=15s"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/victoria-metrics-data
    ports:
      - "8428:8428"                     # VM UI + Prometheus-compatible query API

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../apps/core/priv/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3010:3000"
    depends_on:
      - victoriametrics

volumes:
  vm-data:
