# Load every dashboard-as-code the app ships (apps/core/priv/grafana/*.json),
# mounted read-only into the container. No manual import, no API token.
apiVersion: 1
providers:
  - name: stacks
    orgId: 1
    folder: The Stacks
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
