version: 2

models:

  - name: mart_book_prices
    description: >-
      Latest price per book per store. NO CONSUMER — `BookController.show` does not read this
      mart (verified 2026-10-15). `dbt_refresh_handler.ex:11` names it as a refresh target,
      which is not a reader.
    config:
      meta:
        # Named in dbt_refresh_handler.ex:11, which is a refresh target and
        # not a reader. Kept against a filed issue rather than a hope.
        pending_reader: the price-alerts item; refresh map only today
    columns:
      - name: book_id
        description: FK to books.
        tests:
          - not_null
          - relationships:
              to: ref('stg_books')
              field: id
      - name: store_name
        description: Bookstore name.
      - name: price_cents
        description: Price in minor currency units.
        tests:
          - not_null
      - name: currency
        description: ISO 4217 currency code.
      - name: in_stock
        description: Whether the book is in stock.
      - name: scraped_at
        description: When the price was observed.

  - name: mart_community_read_count
    description: Count of distinct shelf placements per book — consumer BookController.show (social proof).
    config:
      meta:
        deletion_handling: >-
          prune_absent_keys post-hook removes a book whose last placement is deleted.
          A PARTIAL deletion leaves the key present and the count stale, because a
          deletion updates no surviving row and the book never enters the incremental
          window; only a HARD delete reaches this (the app's own removal sets
          removed_at, which bumps updated_at and does recompute). Residual window:
          counts too high by one after an account erasure until the daily
          --full-refresh. No identifier is held, so nothing personal is retained.
        reader: StacksWeb.BookController.show
    columns:
      - name: book_id
        description: FK to books.
        tests:
          - not_null
          - relationships:
              to: ref('stg_books')
              field: id
          - unique
      - name: read_count
        description: Number of distinct shelf placements.
      - name: last_refreshed_at
        description: Timestamp of last incremental refresh.
        tests:
          - not_null

  - name: mart_platform_searchable
    description: >-
      Denormalised book data for catalogue search. NO CONSUMER — `CatalogueController.index`
      does not read this mart (verified 2026-10-15), and platform search is recorded as not
      currently built. `dbt_refresh_handler.ex:19` names it as a refresh target.
    config:
      meta:
        deletion_handling: >-
          prune_absent_keys post-hook. One row per book, so a book is either present
          upstream or pruned — no residual window.
        # Platform search is recorded as not currently built; this mart is
        # its data, waiting. Refresh map names it (handler:19), which is not
        # a reader.
        pending_reader: platform search, recorded unbuilt; refresh map only today
    columns:
      - name: book_id
        description: Book UUID.
        tests:
          - not_null
          - relationships:
              to: ref('stg_books')
              field: id
          - unique
      - name: title
        description: Work title.
        tests:
          - not_null
      - name: author_name
        description: Author display name.
      - name: primary_isbn
        description: Primary edition ISBN.
      - name: primary_cover_image_url
        description: Primary edition cover image URL.
      - name: description
        description: Book description.
      - name: language
        description: Book language.
      - name: visibility_tier
        description: Visibility tier of the book.
      - name: last_refreshed_at
        description: Timestamp of last incremental refresh.
        tests:
          - not_null




  - name: mart_cost_tracking
    description: >-
      Platform operational costs by service. NO CONSUMER — `CostController.index` calls
      `Costs.cost_breakdown/0`, which reads the `op.platform_costs` Ecto context and never
      this mart (verified 2026-10-15). Tests deferred — source table requires dbt role grant.
    config:
      meta:
        # CostController.index reads the op.platform_costs Ecto context, not
        # this mart. Kept as the warehouse-side copy for cost history once
        # the source table carries the dbt role grant.
        pending_reader: cost history once the source table is granted to stacks_dbt
    columns:
      - name: id
        description: Cost record UUID.
      - name: category
        description: Cost category.
      - name: service
        description: Service name.
      - name: amount_cents
        description: Cost in minor currency units.







