version: 2

models:
  - name: stg_books
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: isbn
        tests:
          - not_null
          - unique
      - name: title
        tests:
          - not_null
      - name: author_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_authors')
                field: id

  - name: stg_authors
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: name
        tests:
          - not_null

  - name: stg_users
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: email
        tests:
          - not_null
          - unique
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'user']
      - name: profile_visibility
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']

  - name: stg_bookshelves
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['antilibrary', 'library', 'wishlist', 'reading_pile', 'looking_for_home']
      - name: visibility
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']

  - name: stg_bookshelf_placements
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: book_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: bookshelf_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookshelves')
                field: id
      - name: visibility
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: listing_mode
        tests:
          - accepted_values:
              arguments:
                values: ['open_bid', 'closed_bid']
      - name: listing_status
        tests:
          - accepted_values:
              arguments:
                values: ['draft', 'active', 'sold', 'removed', 'expired']

  - name: stg_bookshelf_placement_history
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: book_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: moved_at
        tests:
          - not_null

  - name: stg_uploaded_images
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['pending', 'resolved', 'rejected']

  - name: stg_audit_log
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: action
        tests:
          - not_null
      - name: resource_type
        tests:
          - not_null
      - name: occurred_at
        tests:
          - not_null
