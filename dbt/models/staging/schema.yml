version: 2

models:
  - name: stg_books
    description: >
      One row per work (logical book) in the catalogue. Edition-specific data
      (ISBN, cover, page count) lives in stg_book_editions.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: title
        description: Work title (canonical, edition suffixes stripped).
        tests:
          - not_null
      - name: author_id
        description: FK to stg_authors.
        tests:
          - relationships:
              arguments:
                to: ref('stg_authors')
                field: id

  - name: stg_authors
    description: >
      One row per author. Populated automatically when a book is added via the
      ISBN resolver; open_library_id links back to the canonical source.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: name
        description: Author display name.
        tests:
          - not_null

  - name: stg_book_editions
    description: >
      One row per edition (specific ISBN/format) of a work. Each edition belongs
      to exactly one work (stg_books). The is_primary flag marks the default edition.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the parent work.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: isbn
        description: Verified ISBN-13 (or ISBN-10 for legacy entries).
        tests:
          - not_null
          - unique

  - name: stg_users
    description: >
      Platform users. Includes the single owner account and any registered
      community users. PII (email, display_name) is encrypted at rest via Cloak.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: email
        description: Unique login email (Cloak-encrypted in the op table).
        tests:
          - not_null
          - unique
      - name: role
        description: Platform role — owner has full admin access.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'user']
      - name: profile_visibility
        description: Visibility of the user's public profile page.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']

  - name: stg_bookshelves
    description: >
      Virtual bookshelves — named collections of books owned by a user.
      Each user has exactly five bookshelves (one per name enum value).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: user_id
        description: FK to the owning user.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: name
        description: Bookshelf category name (enum).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['antilibrary', 'library', 'wishlist', 'reading_pile', 'looking_for_home']
      - name: visibility
        description: Who can see this bookshelf.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']

  - name: stg_bookshelf_placements
    description: >
      A placement is a book's current position on a bookshelf. A book may appear
      on at most one bookshelf at a time per user.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the placed book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: bookshelf_id
        description: FK to the containing bookshelf.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookshelves')
                field: id
      - name: visibility
        description: Visibility of this placement (may differ from bookshelf default).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: listing_mode
        description: Marketplace listing type when the book is for sale (nullable).
        tests:
          - accepted_values:
              arguments:
                values: ['open_bid', 'closed_bid']
      - name: listing_status
        description: Current marketplace listing status (nullable).
        tests:
          - accepted_values:
              arguments:
                values: ['draft', 'active', 'sold', 'removed', 'expired']

  - name: stg_bookshelf_placement_history
    description: >
      Immutable audit trail of every bookshelf move. One row per move event.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the moved book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: moved_at
        description: Timestamp of the move event.
        tests:
          - not_null

  - name: stg_uploaded_images
    description: >
      User-uploaded book cover images. Images expire 30 days after upload
      (GDPR retention policy); status tracks vision-model processing.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: status
        description: Vision-model processing status.
        tests:
          - accepted_values:
              arguments:
                values: ['pending', 'resolved', 'rejected']

  - name: stg_audit_log
    description: >
      Append-only audit log for all significant platform events. Entries are
      never deleted except for GDPR erasure of PII within the metadata payload.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: action
        description: Event action identifier (e.g. user.registered, book.placed).
        tests:
          - not_null
      - name: resource_type
        description: The entity type that was acted upon.
        tests:
          - not_null
      - name: occurred_at
        description: Timestamp when the event occurred.
        tests:
          - not_null

  - name: stg_event_log
    description: >
      Outbox table for all domain events emitted via Stacks.Events.emit/1.
      Oban delivers events to registered subscribers. Immutable except for
      GDPR erasure of PII within the payload.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: event_type
        description: Fully-qualified event type identifier (e.g. book.placed).
        tests:
          - not_null
      - name: aggregate_type
        description: The domain entity type this event applies to.
        tests:
          - not_null
      - name: aggregate_id
        description: UUID of the domain entity this event applies to.
        tests:
          - not_null
      - name: occurred_at
        description: Timestamp when the event was emitted.
        tests:
          - not_null

  # -------------------------------------------------------------------------
  # Social models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_user_blocks
    description: >
      Records where one user has blocked another. Blocking is unidirectional:
      the blocker cannot see the blocked user's content and vice versa.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: blocker_id
        description: FK to the user who initiated the block.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: blocked_id
        description: FK to the user who was blocked.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: created_at
        description: Timestamp when the block was created.
        tests:
          - not_null

  - name: stg_groups
    description: >
      Named user groups that control content visibility. Groups can be
      close-friends circles, broadcast lists, or subscription channels.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: owner_id
        description: FK to the user who owns/administers the group.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: name
        description: Display name for the group.
        tests:
          - not_null
      - name: type
        description: Group category controlling membership and interaction model.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['close_friends', 'broadcast', 'subscription']
      - name: visibility
        description: Who can discover and request to join this group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['invite_only', 'platform']

  - name: stg_group_members
    description: >
      Membership records linking users to groups. Role determines what
      moderation actions the member may perform within the group.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: group_id
        description: FK to the parent group.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: user_id
        description: FK to the group member.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: role
        description: Member's role within the group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['member', 'moderator']
      - name: joined_at
        description: Timestamp when the user joined the group.
        tests:
          - not_null

  - name: stg_group_invitations
    description: >
      Pending and historical invitations to join a group. Once responded_at
      is set, the invitation is terminal (accepted or declined).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: group_id
        description: FK to the group the invitation is for.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: invited_by_id
        description: FK to the user who sent the invitation.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: invited_user_id
        description: FK to the user who was invited.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current state of the invitation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'accepted', 'declined']

  - name: stg_visibility_grants
    description: >
      Fine-grained visibility overrides granting a specific user access to a
      specific resource regardless of that resource's default visibility tier.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: resource_type
        description: The entity type the grant applies to (e.g. bookshelf, blog_post).
        tests:
          - not_null
      - name: resource_id
        description: UUID of the specific resource being granted.
        tests:
          - not_null
      - name: granted_to_id
        description: FK to the user receiving access.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: granted_by_id
        description: FK to the resource owner granting access.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id

  # -------------------------------------------------------------------------
  # Blog models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_blog_posts
    description: >
      Long-form posts authored by users. Visibility controls who can read
      the post; visibility_group_id is required when visibility = 'group'.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: user_id
        description: FK to the post author.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: title
        description: Post title.
        tests:
          - not_null
      - name: visibility
        description: Who can read this post.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: visibility_group_id
        description: FK to the group that can view this post when visibility = 'group'.
        tests:
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id

  - name: stg_post_book_associations
    description: >
      Links blog posts to books mentioned or reviewed within them. The
      confidence and source columns record how the association was derived
      (manual entry, AI extraction, etc.).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: post_id
        description: FK to the parent blog post.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_blog_posts')
                field: id
      - name: book_id
        description: FK to the associated book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: visible
        description: Whether this association is displayed publicly.
        tests:
          - not_null

  # -------------------------------------------------------------------------
  # Marketplace models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_offer_threads
    description: >
      A conversation thread between a buyer and the listing owner to
      negotiate a sale. One thread per (placement, buyer) pair.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: placement_id
        description: FK to the bookshelf placement being negotiated.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookshelf_placements')
                field: id
      - name: buyer_id
        description: FK to the user interested in buying.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current state of the offer thread.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'accepted', 'declined', 'expired']

  - name: stg_offer_messages
    description: >
      Individual messages and offer bids within an offer thread. Monetary
      offer types (offer, counter) carry an amount_cents value.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: thread_id
        description: FK to the parent offer thread.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_offer_threads')
                field: id
      - name: sender_id
        description: FK to the user who sent this message.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: type
        description: Message category.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['message', 'offer', 'counter', 'accept', 'decline']

  - name: stg_listings
    description: >
      Formal marketplace listings created by sellers. A listing references a
      book (not a placement) and may receive bids via offer_threads.
      price_cents must be positive for fixed-price listings.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the book being listed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: seller_id
        description: FK to the user selling the book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current listing lifecycle state.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['draft', 'active', 'sold', 'removed', 'expired']
      - name: pricing_mode
        description: Whether the price is fixed or open to offers.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fixed', 'offer']
      - name: condition
        description: Physical condition of the listed book.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'like_new', 'good', 'fair', 'poor']
      - name: price_cents
        description: Asking price in cents (must be positive for fixed-price listings).
        tests:
          - expression_is_true:
              arguments:
                expression: "price_cents > 0 or price_cents is null"

  - name: stg_transactions
    description: >
      Completed or in-progress payment transactions. Records both payment
      and shipping lifecycle state for each fulfilled listing.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: listing_id
        description: FK to the listing that was transacted.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_listings')
                field: id
      - name: buyer_id
        description: FK to the purchasing user.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: seller_id
        description: FK to the selling user.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: amount_cents
        description: Final agreed transaction amount in cents.
        tests:
          - not_null
      - name: payment_status
        description: Payment processing state.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'failed', 'refunded']

  # -------------------------------------------------------------------------
  # Monitoring models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_source_health_checks
    description: >
      Rolling health state for each external data source (scrapers, review
      feeds, LLM outputs, etc.). Updated by the monitoring worker after each
      probe cycle.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: source_name
        description: Human-readable identifier for the external source.
        tests:
          - not_null
          - unique
      - name: source_type
        description: Category of the external data source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scraper_config', 'review_source', 'rss_feed', 'event_source', 'llm_output']
      - name: consecutive_failures
        description: Number of consecutive probe failures since last success.
        tests:
          - not_null
      - name: status
        description: Aggregated health status derived from recent probe results.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['healthy', 'degraded', 'broken']
