version: 2

models:
  # -------------------------------------------------------------------------
  # Core models
  # -------------------------------------------------------------------------

  - name: stg_books
    description: >
      Proto-synced staging model for books.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: id
        description: Id.
      - name: title
        description: Title.
        tests:
          - not_null
      - name: author_id
        description: Author id.
      - name: description
        description: Description.
      - name: subjects
        description: Subjects.
      - name: visibility_tier
        description: Visibility tier.
        tests:
          - accepted_values:
              arguments:
                values: ['public', 'unlisted', 'private', 'age_gated']
      - name: author
        description: Author.
      - name: editions
        description: Editions.
      - name: edition_count
        description: Edition count.
      - name: primary_edition
        description: Primary edition.
      - name: community_read_count
        description: Community read count.
      - name: language
        description: Language.
      - name: bisac_codes
        description: Bisac codes.
      - name: created_at
        description: Created at.
      - name: updated_at
        description: Updated at.
      - name: created_at
        description: Timestamp when the record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this record.
        tests:
          - not_null

  - name: stg_authors
    description: >
      One row per author. Populated automatically when a book is added via the
      ISBN resolver; open_library_id links back to the canonical source.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: name
        description: Author display name.
        tests:
          - not_null
      - name: website_url
        description: Optional author website URL.
      - name: rss_feed_url
        description: Optional RSS feed URL for author updates.
      - name: open_library_id
        description: Open Library author identifier for canonical linking.
      - name: bio
        description: Optional author biography text.
      - name: created_at
        description: Timestamp when the author record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this author record.
        tests:
          - not_null

  - name: stg_book_editions
    description: >
      One row per edition (specific ISBN/format) of a work. Each edition belongs
      to exactly one work (stg_books). The is_primary flag marks the default edition.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the parent work.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: isbn
        description: Verified ISBN-13 (or ISBN-10 for legacy entries).
        tests:
          - not_null
          - unique
      - name: format_label
        description: Physical format of the edition (e.g. paperback, hardcover, ebook).
      - name: cover_image_url
        description: URL to the edition's cover image.
      - name: page_count
        description: Number of pages in this edition.
      - name: publisher
        description: Publisher name for this edition.
      - name: publication_year
        description: Year this edition was published.
      - name: open_library_id
        description: Open Library edition identifier for canonical linking.
      - name: google_books_id
        description: Google Books volume identifier for fallback lookups.
      - name: is_primary
        description: Whether this is the default edition displayed for the work.
      - name: created_at
        description: Timestamp when the edition record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this edition record.
        tests:
          - not_null

  - name: stg_users
    description: >
      Platform users. Includes the single owner account and any registered
      community users. PII (email, display_name) is encrypted at rest via Cloak.
      Security columns (password_hash, tokens) are excluded from staging.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: email
        description: Unique login email (Cloak-encrypted in the op table).
        tests:
          - not_null
          - unique
      - name: display_name
        description: User-chosen display name shown on their profile.
      - name: role
        description: Platform role — owner has full admin access.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'user']
      - name: profile_visibility
        description: Visibility of the user's public profile page.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: website_url
        description: Optional personal website URL displayed on the user's profile.
      - name: age_verified
        description: Whether the user has completed age verification.
      - name: age_verified_at
        description: Timestamp when age verification was completed.
      - name: age_verification_provider
        description: Name of the provider used for age verification.
      - name: country_code
        description: ISO 3166-1 alpha-2 country code (defaults to ZA).
      - name: city
        description: Optional city name for location-based features.
      - name: consent_analytics
        description: Whether the user has consented to analytics tracking.
      - name: consent_analytics_at
        description: Timestamp when analytics consent was granted or revoked.
      - name: onboarding_completed
        description: Whether the user has finished the onboarding flow.
        tests:
          - not_null
      - name: notify_wishlist_availability
        description: Opt-in for notifications when wishlist books become available.
        tests:
          - not_null
      - name: notify_marketplace
        description: Opt-in for marketplace activity notifications.
        tests:
          - not_null
      - name: notify_group_invitations
        description: Opt-in for group invitation notifications.
        tests:
          - not_null
      - name: notify_event_matches
        description: Opt-in for event match notifications.
        tests:
          - not_null
      - name: email_confirmed
        description: Whether the user has confirmed their email address.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the user account was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this user record.
        tests:
          - not_null

  - name: stg_bookshelves
    description: >
      Virtual bookshelves — named collections of books owned by a user.
      Each user has exactly five bookshelves (one per name enum value).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: user_id
        description: FK to the owning user.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: name
        description: Bookshelf category name (enum).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['antilibrary', 'library', 'wishlist', 'reading_pile', 'looking_for_home']
      - name: visibility
        description: Who can see this bookshelf.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: visibility_group_id
        description: FK to the group that can view this bookshelf when visibility = 'group'.
        tests:
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: created_at
        description: Timestamp when the bookshelf was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this bookshelf.
        tests:
          - not_null

  - name: stg_bookshelf_placements
    description: >
      A placement is a book's current position on a bookshelf. A book may appear
      on at most one bookshelf at a time per user.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the placed book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: bookshelf_id
        description: FK to the containing bookshelf.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookshelves')
                field: id
      - name: position
        description: Sort order position within the bookshelf (nullable for unordered shelves).
      - name: placed_at
        description: Timestamp when the book was placed on this bookshelf.
      - name: removed_at
        description: Timestamp when the book was removed (soft delete; null if still placed).
      - name: formats
        description: Array of owned format labels (e.g. paperback, hardcover) for this placement.
      - name: personal_rating
        description: User's personal rating for this book (nullable; scale TBD).
      - name: notes
        description: Free-text notes the user has attached to this placement.
      - name: visibility
        description: Visibility of this placement (may differ from bookshelf default).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: listing_mode
        description: Marketplace listing type when the book is for sale (nullable).
        tests:
          - accepted_values:
              arguments:
                values: ['open_bid', 'closed_bid']
      - name: listing_status
        description: Current marketplace listing status (nullable).
        tests:
          - accepted_values:
              arguments:
                values: ['draft', 'active', 'sold', 'removed', 'expired']
      - name: listing_price_cents
        description: Asking price in cents when the placement is listed for sale.
      - name: listing_min_price_cents
        description: Minimum acceptable price in cents for bid-based listings.
      - name: created_at
        description: Timestamp when the placement record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this placement.
        tests:
          - not_null

  - name: stg_bookshelf_placement_history
    description: >
      Immutable audit trail of every bookshelf move. One row per move event.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the moved book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: from_bookshelf
        description: FK to the bookshelf the book was moved from (null for initial placement).
        tests:
          - relationships:
              arguments:
                to: ref('stg_bookshelves')
                field: id
      - name: to_bookshelf
        description: FK to the bookshelf the book was moved to (null for removal).
        tests:
          - relationships:
              arguments:
                to: ref('stg_bookshelves')
                field: id
      - name: moved_at
        description: Timestamp of the move event.
        tests:
          - not_null

  - name: stg_uploaded_images
    description: >
      User-uploaded book cover images. Images expire 30 days after upload
      (GDPR retention policy); status tracks vision-model processing.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the book this image is associated with (legacy single-book link).
        tests:
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: storage_path
        description: Object storage path to the uploaded image file.
      - name: status
        description: Vision-model processing status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'resolved', 'rejected']
      - name: rejection_reason
        description: Human-readable reason if the image was rejected by the vision model.
      - name: uploaded_at
        description: Timestamp when the image was uploaded.
        tests:
          - not_null
      - name: expires_at
        description: Timestamp when the image will be purged (30-day GDPR retention).
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the image record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this image record.
        tests:
          - not_null
      - name: book_ids
        description: Array of book UUIDs resolved from a multi-spine upload.
      - name: book_edition_id
        description: FK to the specific edition matched by ISBN extraction.
        tests:
          - relationships:
              arguments:
                to: ref('stg_book_editions')
                field: id

  - name: stg_audit_log
    description: >
      Append-only audit log for all significant platform events. Entries are
      never deleted except for GDPR erasure of PII within the metadata payload.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: user_id
        description: FK to the user who triggered the event (null for system events).
        tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: action
        description: Event action identifier (e.g. user.registered, book.placed).
        tests:
          - not_null
      - name: resource_type
        description: The entity type that was acted upon.
        tests:
          - not_null
      - name: resource_id
        description: UUID of the specific resource that was acted upon.
      - name: metadata
        description: Protobuf-encoded event metadata payload.
      - name: ip_address
        description: IP address of the request that triggered the event.
      - name: occurred_at
        description: Timestamp when the event occurred.
        tests:
          - not_null

  - name: stg_event_log
    description: >
      Proto-synced staging model for event_log.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: event_type
        description: Event type.
        tests:
          - not_null
      - name: aggregate_type
        description: Aggregate type.
        tests:
          - not_null
      - name: aggregate_id
        description: Aggregate id.
        tests:
          - not_null
      - name: schema_version
        description: Schema version.
        tests:
          - not_null
      - name: payload
        description: Payload.
        tests:
          - not_null
      - name: metadata
        description: Metadata.
        tests:
          - not_null
      - name: occurred_at
        description: Occurred at.
        tests:
          - not_null
      - name: published_at
        description: Published at.

  # -------------------------------------------------------------------------
  # Social models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_user_blocks
    description: >
      Records where one user has blocked another. Blocking is unidirectional:
      the blocker cannot see the blocked user's content and vice versa.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: blocker_id
        description: FK to the user who initiated the block.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: blocked_id
        description: FK to the user who was blocked.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: created_at
        description: Timestamp when the block was created.
        tests:
          - not_null

  - name: stg_groups
    description: >
      Named user groups that control content visibility. Groups can be
      close-friends circles, broadcast lists, or subscription channels.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: owner_id
        description: FK to the user who owns/administers the group.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: name
        description: Display name for the group.
        tests:
          - not_null
      - name: type
        description: Group category controlling membership and interaction model.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['close_friends', 'broadcast', 'subscription']
      - name: visibility
        description: Who can discover and request to join this group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['invite_only', 'platform']
      - name: created_at
        description: Timestamp when the group was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this group.
        tests:
          - not_null

  - name: stg_group_members
    description: >
      Membership records linking users to groups. Role determines what
      moderation actions the member may perform within the group.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: group_id
        description: FK to the parent group.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: user_id
        description: FK to the group member.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: role
        description: Member's role within the group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['member', 'moderator']
      - name: joined_at
        description: Timestamp when the user joined the group.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the membership record was created.
        tests:
          - not_null

  - name: stg_group_invitations
    description: >
      Pending and historical invitations to join a group. Once responded_at
      is set, the invitation is terminal (accepted or declined).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: group_id
        description: FK to the group the invitation is for.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: invited_by_id
        description: FK to the user who sent the invitation.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: invited_user_id
        description: FK to the user who was invited.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current state of the invitation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'accepted', 'declined']
      - name: responded_at
        description: Timestamp when the invitation was accepted or declined (null if pending).
      - name: created_at
        description: Timestamp when the invitation was sent.
        tests:
          - not_null

  - name: stg_visibility_grants
    description: >
      Fine-grained visibility overrides granting a specific user access to a
      specific resource regardless of that resource's default visibility tier.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: resource_type
        description: The entity type the grant applies to (e.g. bookshelf, blog_post).
        tests:
          - not_null
      - name: resource_id
        description: UUID of the specific resource being granted.
        tests:
          - not_null
      - name: granted_to_id
        description: FK to the user receiving access.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: granted_by_id
        description: FK to the resource owner granting access.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: created_at
        description: Timestamp when the visibility grant was created.
        tests:
          - not_null

  # -------------------------------------------------------------------------
  # Blog models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_blog_posts
    description: >
      Long-form posts authored by users. Visibility controls who can read
      the post; visibility_group_id is required when visibility = 'group'.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: user_id
        description: FK to the post author.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: title
        description: Post title.
        tests:
          - not_null
      - name: body
        description: Full post body content.
        tests:
          - not_null
      - name: visibility
        description: Who can read this post.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['owner', 'group', 'platform']
      - name: visibility_group_id
        description: FK to the group that can view this post when visibility = 'group'.
        tests:
          - relationships:
              arguments:
                to: ref('stg_groups')
                field: id
      - name: published_at
        description: Timestamp when the post was published (null if draft).
      - name: created_at
        description: Timestamp when the post record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this post.
        tests:
          - not_null

  - name: stg_post_book_associations
    description: >
      Links blog posts to books mentioned or reviewed within them. The
      confidence and source columns record how the association was derived
      (manual entry, AI extraction, etc.).
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: post_id
        description: FK to the parent blog post.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_blog_posts')
                field: id
      - name: book_id
        description: FK to the associated book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: confidence
        description: Association confidence score (0.0 to 1.0).
        tests:
          - not_null
      - name: reasoning
        description: Explanation of how/why this association was derived.
      - name: source
        description: How the association was created (e.g. llm, manual).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['llm', 'manual']
      - name: visible
        description: Whether this association is displayed publicly.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the association was created.
        tests:
          - not_null

  # -------------------------------------------------------------------------
  # Marketplace models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_offer_threads
    description: >
      A conversation thread between a buyer and the listing owner to
      negotiate a sale. One thread per (placement, buyer) pair.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: placement_id
        description: FK to the bookshelf placement being negotiated.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookshelf_placements')
                field: id
      - name: buyer_id
        description: FK to the user interested in buying.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current state of the offer thread.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'accepted', 'declined', 'expired']
      - name: created_at
        description: Timestamp when the offer thread was opened.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last activity on this thread.
        tests:
          - not_null

  - name: stg_offer_messages
    description: >
      Individual messages and offer bids within an offer thread. Monetary
      offer types (offer, counter) carry an amount_cents value.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: thread_id
        description: FK to the parent offer thread.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_offer_threads')
                field: id
      - name: sender_id
        description: FK to the user who sent this message.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: type
        description: Message category.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['message', 'offer', 'counter', 'accept', 'decline']
      - name: body
        description: Free-text message body (null for pure offer/counter messages).
      - name: amount_cents
        description: Monetary amount in cents for offer/counter message types.
      - name: created_at
        description: Timestamp when the message was sent.
        tests:
          - not_null

  - name: stg_listings
    description: >
      Formal marketplace listings created by sellers. A listing references a
      book (not a placement) and may receive bids via offer_threads.
      price_cents must be positive for fixed-price listings.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: book_id
        description: FK to the book being listed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_books')
                field: id
      - name: seller_id
        description: FK to the user selling the book.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: status
        description: Current listing lifecycle state.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['draft', 'active', 'sold', 'removed', 'expired']
      - name: pricing_mode
        description: Whether the price is fixed or open to offers.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fixed', 'offer']
      - name: price_cents
        description: Asking price in cents (must be positive for fixed-price listings).
        tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "price_cents > 0 or price_cents is null"
      - name: currency
        description: ISO 4217 currency code for the listing price (defaults to ZAR).
        tests:
          - not_null
      - name: condition
        description: Physical condition of the listed book.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'like_new', 'good', 'fair', 'poor']
      - name: description
        description: Seller's free-text description of the listed book.
      - name: photo_urls
        description: Array of URLs to listing photos.
        tests:
          - not_null
      - name: listed_at
        description: Timestamp when the listing went active (null if still draft).
      - name: expires_at
        description: Timestamp when the listing will auto-expire.
      - name: sold_at
        description: Timestamp when the listing was marked as sold.
      - name: created_at
        description: Timestamp when the listing record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this listing.
        tests:
          - not_null

  - name: stg_transactions
    description: >
      Completed or in-progress payment transactions. Records both payment
      and shipping lifecycle state for each fulfilled listing. buyer_id and
      seller_id are nullable due to GDPR erasure.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: listing_id
        description: FK to the listing that was transacted.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_listings')
                field: id
      - name: offer_id
        description: Soft reference to the accepted offer thread (nullable; no FK constraint).
      - name: buyer_id
        description: FK to the purchasing user (nullable due to GDPR erasure).
        tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: seller_id
        description: FK to the selling user (nullable due to GDPR erasure).
        tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: id
      - name: amount_cents
        description: Final agreed transaction amount in cents.
        tests:
          - not_null
      - name: currency
        description: ISO 4217 currency code for the transaction (defaults to ZAR).
        tests:
          - not_null
      - name: payment_provider_ref
        description: External payment provider reference/transaction ID.
      - name: payment_status
        description: Payment processing state.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'failed', 'refunded']
      - name: shipping_provider_ref
        description: External shipping provider tracking reference.
      - name: shipping_status
        description: Current shipping lifecycle state.
      - name: shipping_cost_cents
        description: Shipping cost in cents (nullable if not yet calculated).
      - name: completed_at
        description: Timestamp when the transaction was fully completed.
      - name: created_at
        description: Timestamp when the transaction record was created.
        tests:
          - not_null

  # -------------------------------------------------------------------------
  # Monitoring models (Issue #043)
  # -------------------------------------------------------------------------

  - name: stg_source_health_checks
    description: >
      Proto-synced staging model for source_health_checks.
    columns:
      - name: id
        description: Surrogate UUID primary key.
        tests:
          - not_null
          - unique
      - name: source_name
        description: Source name.
        tests:
          - not_null
      - name: source_type
        description: Source type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scraper_config', 'review_source', 'rss_feed', 'event_source', 'llm_output']
      - name: last_success_at
        description: Last success at.
      - name: last_failure_at
        description: Last failure at.
      - name: last_failure_reason
        description: Last failure reason.
      - name: consecutive_failures
        description: Consecutive failures.
        tests:
          - not_null
      - name: total_successes
        description: Total successes.
        tests:
          - not_null
      - name: total_failures
        description: Total failures.
        tests:
          - not_null
      - name: status
        description: Status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['healthy', 'degraded', 'broken']
      - name: created_at
        description: Timestamp when the record was created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp of the last modification to this record.
        tests:
          - not_null
