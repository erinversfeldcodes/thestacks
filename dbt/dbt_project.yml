name: thestacks
version: "0.1.0"
config-version: 2

profile: thestacks

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  thestacks:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  thestacks:
    +schema: op
    audit_log:
      +schema: audit
    books:
      +column_types:
        isbn: text
